;--------------------------------------------------------------------------
; Schematic randomizer
;--------------------------------------------------------------------------
; Shuffles which item each of the 23 campaign schematic pickups unlocks,
; including the Force Gun schematic that comes out of a container.
; Completion-gated elite suits and Hacker content stay out of the pool.

[SchematicRandomizer]

Enabled=1

; A missed item reaches the store at the chapter of the place its
; schematic now lies at. Off: items unlock at their usual chapter.
StoreFollowsSchematics=1

; The first schematic pickup always unlocks a weapon, the second an
; affordable suit (Security or Steampunk).
FirstIsWeapon=1
SecondIsSuit=1

; Defaults to the [DS2Randomizer] seed above.
; Seed=69

;--------------------------------------------------------------------------
; Bench upgrade randomizer
;--------------------------------------------------------------------------
; The game works out what an upgrade node awards from the node's name,
; every time it needs it. Only that answer is redirected, so the grid, the
; authored connections, the navigation and your save stay untouched.
;
; Do not change the seed part-way through a playthrough: nodes you already
; paid for would start awarding something else.

[BenchRandomizer]

; Trade stats between upgrade nodes. A trade is only kept when every
; tree it touches still offers exactly the stats it offered before, so
; a tree can neither pick up a foreign stat nor lose one of its own:
; Width stays on the Line Gun, and stasis never offers it.
StatShuffle=1

; Move stats to different cells within one tree, filler nodes included,
; so an upgrade can sit where there used to be a plain connector.
; Only affects node names that belong to exactly one tree, because the
; game's name-to-stat mapping is global.
NodeShuffle=1

; Keep a real stat on the cells a tree opens with, so it never starts
; on an empty node.
ProtectStartPoints=1

; Defaults to the [DS2Randomizer] seed above.
; Seed=69

[ExitGuard]

; Level exit guard. Five load states of the level manager only move on when
; a stream load completes. When a load reuses a copy that is still loaded
; (the menu after a held pool), nothing completes and the screen stays black.
; The guard sends that completion itself once both stream queues have been
; idle for NudgeAfterMs, at most MaxNudges times per state.
Enabled=1
NudgeAfterMs=1500
MaxNudges=5

; Last resort: restart the game when a load state does not move for
; RestartAfterSeconds while nothing streams, or when the main loop has not run
; a frame for FrozenSeconds while the game is in front (0 = no frozen check).
; Writes C:\DS2CrashDumps\deadspace2.stuck.<pid>.dmp first.
Restart=1
RestartAfterSeconds=60
FrozenSeconds=30
