;--------------------------------------------------------------------------
; Dead Space 2 Randomizer
;--------------------------------------------------------------------------
; Experimental. Back up your saves before changing anything here.
; Restart the game after editing this file; nothing is re-read at runtime.
; Every switch is 0 for off and 1 for on unless a range is given.

[DS2Randomizer]
; Wait this long after the game image is ready before installing hooks, so other
; plugins that verify retail bytes (the DS2 Debug Menu) bind first.
InstallDelayMs=3000

; --- Main switch -------------------------------------------------------

; Master switch. With this off nothing is randomized and only FpsCap and
; NavPowerPoolKiB stay active.
Enabled=1

; Any number. The same seed always produces the same run.
Seed=69

; Percent chance that an eligible spawn is replaced. Range: 0 to 100.
; 0 keeps every spawn as authored.
Chance=0

; --- Frame rate ---------------------------------------------------------

; Frame rate limit. Range: 30 to 240, a value from 1 to 29 is raised to 30.
; 0 leaves the frame rate alone and only counts frames for the log. High
; frame rates are fine: the lift hangs they used to cause are handled by
; ZoneUnloadHeal below.
FpsCap=0
; Every 30 s and at each survival wave one log line with frame times, hitches,
; memory, free address space and texture memory; hitches over 100 ms one by one.
PerfDiag=1

; --- What may replace what --------------------------------------------

; Allow a different enemy species, not just another variant of the same
; one. Needs more in-game testing than same-family replacement.
CrossFamily=1

; Same-family variants that share the exact authored vent and spawn
; settings.
VentVariants=1

; Authored same-vent pairs across families. Requires CrossFamily=1.
CrossFamilyVents=1

; Point a donor at the vent the level authored, instead of requiring it
; to be authored on that same vent. Only donors that are themselves vent
; arrivals qualify, because the climb-out belongs to the species, and
; the rest of the arrival contract (mode and activation flags) still
; has to match. Raises the vent spawns that have a donor in the same
; room from 196 to 282 of 392. Requires VentVariants=1; cross-family
; pairs also require both cross-family switches above.
VentRebinding=1

; Let two vent spawns match when only their spawn-done messages differ.
;
; That message is what a level script waits for (a door, the next wave,
; the end of a quarantine), so it was part of what makes two spawns
; interchangeable. It is also the only thing keeping 26 of the 35 vent
; spawns no donor can reach: three leapers stand together in the med
; storage and two of them are unreachable for this one field.
;
; Safe only because the rebind hands the replacement the level's own
; spawning component, so the message comes with it rather than being
; written afterwards. Requires VentRebinding and is ignored without it.
; Watch `relaxed=` next to `missed=` in the vent_binding line.
VentMessageContract=0

; A replaced enemy keeps the original spawn's stream handle instead of
; the donor's, so it belongs to the level and is torn down together with
; the state tables it indexes. See analysis/STATE_TABLE_GENERATIONS.md.
PoolActorsFollowLevel=1

; Release the resident pool root at the level's own release point, the
; point the engine uses for its own streams. Off: the root is held until
; the level teardown removes the streaming service.
ReleasePoolAtLevelEnd=1

; Never release the pool. Debug only: the next level transition waits
; for the pool stream forever. The release crashes it once worked around
; were an identity collision, see analysis/POOL_IDENTITY_COLLISION.md.
PoolHoldForever=0

; Skip handing a resource handle back to the streaming service while
; that service is null. It is only null between its destruction and the
; end of the level teardown, and the cleanup that runs in between used to
; fault on it. See analysis/CRASH_39616_MENU_HAVOK.md.
GuardServiceRelease=1

; Spawns that arrive through an authored animation instead of a vent,
; plus the play-dead lifecycle. The donor must be authored somewhere with
; an identical spawning component: mode, both animation names, animation
; options, activation flags and every activation and completion message.
; Same family only. See analysis/SCRIPTED_ARRIVALS.md.
; Experimental, not tested in game.
ScriptedArrivals=1

; Corpses that arrive through the infection lifecycle. Same contract as
; ScriptedArrivals, kept separate because these also depend on infector
; target selection and corpse resources.
InfectedArrivals=1

; How many template lookups one replacement attempt may make.
; Range: 1 to 16.
MaxDonorLookups=8

; Takes the pool's pack boy template that never attacks out of play. Its
; hand-made stand-in is withdrawn in this build, so this only removes the
; broken template. Needs GlobalTemplates=1.
DirectDonors=1

; --- Global template pool ----------------------------------------------

; Load private enemy templates across levels, so a donor can be used in a
; chapter that does not ship it. Experimental. Requires the matching STR
; and TOC next to the executable.
GlobalTemplates=1

; Hold a reference on the shared character streams the pool needs, so a
; room change cannot free the state tables of enemies built from it.
; This is the experiment for the crash in
; analysis/STATE_TABLE_LIFETIME_20260909.md. It changes engine
; reference counts, which is the riskiest thing this plugin does.
PinPoolPrerequisites=0

; Developer loading probe for that pool. Does not enable replacement on
; its own. Leave off for normal play.
GlobalStreamProbe=1

; --- Loading screen and zone switches -----------------------------------

; The loading screen stays at least this long, in seconds. Range: 0 to 60.
MinimumLoadingSeconds=0

; Hold the loading screen until the enemy pool is loaded, up to
; MaximumLoadingSeconds. Off: the first spawns of a level can be decided
; before the pool is in and stay original.
LoadingWaitsForPool=1

; Upper limit for that wait, in seconds. Range: 0 to 120.
MaximumLoadingSeconds=30

; Let an area switch go on when only the enemy pool still holds one of
; the level's character packages. Without it lifts and doors can wait
; forever at high frame rates (above about 95 FPS).
ZoneUnloadHeal=1

; How long a package has to hold an area switch up before ZoneUnloadHeal
; steps in, in milliseconds. Range: 0 to 5000.
ZoneUnloadHealDelayMs=250

; --- Stat variants and test aids ---------------------------------------

; Faster, tougher or recoloured enemy variants from the pool. This build
; carries none of them, so both switches do nothing.
Variants=0
VariantRuntime=0
; Severed enemies from the Severed packages: the security and oracle twitchers (slashers:
; fast, dodging, 200/350 health, no grab) and the Severed pregnant. Their own switch,
; independent of Variants. TwitcherChance / SeveredPregnantChance are the percentages of
; campaign slashers / pregnants that become their Severed counterpart when Chance leaves
; them alone; with Chance above 0 they also compete in the ordinary draw ([Variants]).
Twitchers=1
TwitcherChance=15
SeveredPregnantChance=15

; Test aid: this variant name wins every draw it takes part in. Leave
; empty.
VariantBias=

; Test aid: writes the donor order for one source GUID to the log. Leave
; empty.
PlanDump=

; --- More enemies ------------------------------------------------------

; Spawn multiplier. It repeats an authored arrival that already
; succeeded, using the same message the engine uses for its own queued
; retry. It never picks a donor and never touches the global template
; pool. How many is set per family in [MoreEnemies] below.
; See analysis/MORE_ENEMIES_20260909.md.
MoreEnemies=1

; Repeat vent arrivals as well. A repeat starts a second climb-out
; animation in the same vent while the first one is still playing.
MoreEnemiesVents=1

; Gap between repeated vent spawns in milliseconds. A vent carries one
; enemy at a time, and two in the same frame block each other. 2000 is
; what the game uses for its own retries. 0 repeats them at once, the
; old behaviour.
MoreEnemiesVentDelayMs=2000
; A vent repeat also waits until nothing has come out of that vent for this
; long, the game's own retries included. Two slashers in one wall vent at the
; same time crash the game. 0 = no such wait.
MoreEnemiesVentGapMs=4000
; A vent repeat also waits until no enemy that came out of that vent is still
; inside it (an enemy in stasis can hang in the vent mouth for many seconds),
; and gives up after 90 s. A dead or vanished enemy left first in a vent's
; queue is taken out so the others can come. 0 = the old timing only.
VentQueueGuard=1

; Hide the copies' per-spawn completion message from level logic, so a
; level that counts spawn completions counts each spawn point once. With
; 0 it also counts the copies. When the message cannot be hidden, that
; spawn is not multiplied.
MoreEnemiesHideCompletion=1

; Hard ceiling on the total per trigger, whatever [MoreEnemies] asks
; for. Range: 1 to 8.
MoreEnemiesMaxPerTrigger=4

; When the randomizer replaced the enemy with another family, the
; multiplier uses the smaller of the two families' totals (1), or does
; not multiply such a replacement at all (0). A swarmer slot is never
; multiplied, whatever stands there: a room authored for a dozen
; swarmers, each replaced by a stalker and repeated four times, is how
; a session ends.
MoreEnemiesCrossFamily=1

; Extra spawns a window of sixteen arrivals may hold, all families
; together. Range: 0 to 112; 0 stops them. Rule of thumb: 16 x (largest
; [MoreEnemies] total - 1), so 48 for totals of 4. 12 multiplies only
; four of sixteen arrivals.
MoreEnemiesPerSecond=48

; A story scene's own actor (a FuncSpawn whose target a se_*/igc_* sequence names)
; is not multiplied: the copies are in no scene and roam where the level never
; puts one. Combat entrances stay multiplied. 12.10.: the saferoom slasher x4.
MoreEnemiesSkipScripted=1

; --- Hordes and extra spawns -------------------------------------------

; A swarmer or pack boy that replaces another kind of enemy arrives as a
; horde of this many; one standing in for a slasher is no threat alone.
; Works with or without MoreEnemies, which never stacks on a horde.
; Range: 1 to 12, 1 = no horde.
SwarmHorde=6
PackHorde=4

; Read plugins\DS2ExtraSpawns.tsv: extra enemies placed with the Spawner
; Editor. Rows bound to a spawner also need SpawnerTools=1; area rows
; (near:<m>) do not. Needs the replacement itself (Enabled=1).
ExtraSpawns=1

; Windows virtual-key code of the key that writes your position and the
; nearest spawners to the log, for the Spawner Editor. 121 = F10.
PlacementHotkey=121

; --- Engine limits ------------------------------------------------------

; The pathfinding library (NavPower) gets one fixed memory pool from
; the game: 576 KiB in retail, room for about 160 navigating enemies.
; One more and the game stops itself ("System ran out of available
; heap memory"). This hands it a larger pool. Range: 0 to 65536 KiB,
; 0 = retail. 4608 = eight times retail.
NavPowerPoolKiB=4608

; --- Runaway watchdog ---------------------------------------------------

; Watch the enemies the randomizer created. One that outlives the
; timeout below is reported to the log, so a replacement that ended up
; somewhere it cannot be reached can be found instead of quietly holding
; a room closed. The switches below decide what else the watchdog does.
Watchdog=1

; The fix for the state-table crash. The game rebuilds its state
; tables into a fresh block and frees the old one; enemies the
; randomizer created survive that boundary and keep pointing into the
; freed block, which is what crashes. This points them back at the table
; their own class is using now. See analysis/STATE_TABLE_GENERATIONS.md.
WatchdogRepairTables=1

; When a replacement could not be given the original enemy's death message
; (death_message refused= in the log), the watchdog says that message the
; moment the replacement dies, so a room that counts deaths still completes.
WatchdogDeathProxy=1

; Actually kill an enemy the watchdog reported, through the engine's own
; zero-health path so the death events, the drop and any door counter
; fire normally. Only families enabled in [WatchdogFamilies] below are
; ever eligible, and bosses, anchored actors and owned parts are refused
; in code whatever that section says.
WatchdogKill=1

; A scripted room counts death messages, not corpses, so a replacement
; that never came alive holds the door shut forever. With this on the
; watchdog says that one message for it when it gives up on it: only for
; an actor with no state machines after the full timeout, or one still
; stuck in its vent, never for an enemy you simply have not reached yet.
WatchdogReleaseDeathMessage=1

; How long a replaced enemy may live before it is reported.
; Range: 10 to 3600. An enemy the player has simply not reached yet is
; perfectly normal, so a report is not a fault in itself.
WatchdogSeconds=90

; A shorter timeout for enemies that came through a rebound vent. Those
; are the ones that get stuck: in one friend's session 10 of 13 stranded
; enemies came out of such a vent, and a quarantine waits for every one
; of them. Applies to families enabled in [WatchdogFamilies]; such an
; enemy gets this or its usual timeout, whichever is shorter, so it never
; waits longer. Range: 0 to 600, 0 uses the normal timeout.
WatchdogVentSeconds=0

; After how many seconds the watchdog logs once what a replaced enemy is
; doing. The timeout alone only says it is still alive; the state name
; says whether it is still in its arrival. The check runs at this time or
; at WatchdogVentStuckSeconds, whichever is later. 0 turns it off.
WatchdogStateProbeSeconds=6

; From when a replaced enemy counts as a suspect for being stuck in its
; vent. Not the time alone decides, but whether one of the vent state
; machines is still running. A suspect is only logged; if it is still in
; the vent when its timeout runs out, the donor goes on
; DS2VentDonorBlocklist.tsv so later runs do not pick it for vents again.
; 0 turns this off.
WatchdogVentStuckSeconds=60

; --- Diagnostics -------------------------------------------------------

; Write a line per spawn to the log.
ObserveSpawns=1

; Buffer for detailed spawn lines between two log writes. 0 turns them
; off; the counters keep running. Range: 0 to 4096.
DetailedSpawnLimit=2048

; Read-only registry snapshots every five seconds, up to 60 reports.
; Requires Enabled=1.
StreamRegistryDiagnostics=1

; Continuous read-only stream changes and pending-state samples.
StreamWatchDiagnostics=1

; One log line per script message. Very noisy; only when asked for.
MessageTrace=0

; Texture and skin probe. Debug only.
TextureProbe=0

; Sound probe: per enemy family, how many sound events its Lua handler asks for
; and how many the loaded banks have. Debug only, read only.
SoundProbe=0

; Per-spawner rules (DS2SpawnerRules.tsv) and a rolling recent-spawn list
; for the Spawner Editor. Extra spawns bound to a spawner
; (DS2ExtraSpawns.tsv) need it too.
SpawnerTools=1

[Loot]
; Ammo and credit pickups in percent of what the level authored, 25 to 500.
; 100 leaves them alone. Applied when the game builds the pickup.
AmmoPercent=134
CreditsPercent=100

