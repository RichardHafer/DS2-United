; Companion bot profiles (DS2United.ini [Bot] Profiles=1). One section per bot.
; Every key is optional; a missing one keeps the built-in value of that bot.
;
; Name              shown in the log
; FavoriteSuits     suits it wears first, best first, comma separated; only suits you own
;                   (worn or in your safe) count. Names as in the store:
;                   Engineering, Security, Vintage, Advanced, Arctic Security, Riot Security,
;                   Soldier, Patrol, Zealot, Shockpoint, Bloody Vintage, Forged Engineering,
;                   EarthGov Security, Heavy Duty Vintage, Hazard, Agility Advanced, Triage,
;                   Elite Engineering, Elite Security, Elite Vintage, Elite Advanced, Hacker, Patient
;                   ("Suit" at the end is optional). Outside the campaign ([Bot] ModeLoadout,
;                   Progression) any suit counts: the first one no other bot took.
; ForceSuit         one suit it always wears, owned by you or not, empty = it picks as above.
;                   Same names as FavoriteSuits, e.g. ForceSuit=Elite Advanced
; Antics            0 never, 1 rare, 2 now and then, 3 often: with nothing about it now
;                   and then does something playful near you (taps its aim at your face,
;                   stares at you, stomps its own fresh kill, shadow boxes). One bot at a
;                   time; any danger breaks it off. [Bot] AnticsEnabled=0 turns them off for all.
; HarmfulAntics     1 = with Antics on it may also, very rarely, put a stasis shot on you
;                   from a few metres away. 0 = never.
; FavoriteWeapons   guns it buys and keeps first, best first, comma separated:
;                   PlasmaCutter, PulseRifle, LineGun, Javelin, Ripper, Detonator,
;                   Flamethrower, SeekerRifle, ForceGun, ContactBeam
;                   Outside the campaign they are the likeliest picks for its kit.
; ReactionMinMs/MaxMs   how long before it notices a new enemy, starts to follow or
;                   runs for a door (a third of it for an enemy right on it)
; PostCombatMinMs/MaxMs eyes open (aiming, looking around) this long after a fight
; AimAcquireMs      a new target is aimed at this long before the first shot
; AimSway           metres its aim point wanders around the target (more when hurt or crowded)
; AimSpeed          how fast it turns its aim (1 = normal)
; AimSkill          0 sloppy to 1 sharp: how far its first aim at a new target is off,
;                   how fast that settles and how much its aim wanders ([Bot] HumanAim)
; Courage           0 backs off early, 1 lets enemies come close before it backs off
; PreferredDistance metres from the target it likes to fight at
; HealBelowPercent  uses a med pack below this much health
; KinesisChance     percent: when an enemy comes near, how likely it wants a kinesis object
; WalkPace          walking speed (0.5 to 1), running is always full speed
; FollowAngle       its place beside you, degrees from where you face (+ right, - left,
;                   0 in front, 180 behind), FollowDistance metres away
; WatchAngle        the direction it keeps an eye on when nothing happens (same degrees)
; CombatSide        +1 or -1: its side of you in a fight; CombatSideMeters how far out,
;                   CombatBack how far back from you (away from the enemy)

