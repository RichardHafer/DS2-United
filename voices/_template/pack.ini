; A voice pack: copy this folder to plugins\voices\<your pack name>\, put your
; recordings next to this file and list them below. One line per file:
;     file.wav
;     file.wav|Subtitle text shown while it plays
; A section with several files picks one at random, never the same twice in a row.
; Sections without files are simply silent. See voices\README.md.

