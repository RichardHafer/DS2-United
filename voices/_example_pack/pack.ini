; Example voice pack with one folder per event. To use it: copy this folder to
; <game>\plugins\voices\<your name>\ (a name without a leading "_", which hides a pack),
; record the files listed in each RECORD_HERE.txt into that folder and keep the names,
; or change the lines below. Paths are relative to this file. See voices\README.md.

