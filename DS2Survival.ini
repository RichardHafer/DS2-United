;======================================================================
; Dead Space 2 survival waves (DS2RandomizerObserver.asi)
;======================================================================
;
; Copy next to the plugins (plugins\DS2Survival.ini). Read at the start of
; every survival run, so edits apply from the next run on.
;
; Needs: the randomizer on (DS2Randomizer.ini Enabled=1, GlobalTemplates=1,
; GlobalStreamProbe=1) for the enemy pool, and the co-op plugin's [MpMap]
; to reach the map. Runs only while the current map is Map below.
; Log lines start with "survival" in DS2Randomizer.log.

[Survival]
; Experimental. The code default is 0; this template turns it on for the
; first playtest. The director does nothing on any map but Map; "any" runs it on
; every MP map, the Outbreak maps included (the best wave is kept per map).
Enabled=1
Map=any

; The first wave starts this long after arrival (0: only on StartKey).
StartDelaySeconds=20
; Virtual key that starts the first wave at once or skips a pause (0: none).
; 107 is Numpad +.
StartKey=107

; Enemies alive at once (capped at 10 when the NavPower pool hook is off).
; A campaign arena's maxalive= line (arenas\arena_*.txt) replaces it there.
MaxAlive=15
; Time between two spawns, and before the first spawn of a wave.
SpawnIntervalMs=1500
WaveStartDelayMs=2500
; Pause between waves.
PauseSeconds=20
; Every player down (DS2United.ini [Respawn]): the game over shows this long, then
; everybody respawns and the next run starts from wave 1.
GameOverSeconds=10
; 1: the MP map then reloads from its checkpoint, like the pause menu's restart
; (doors, pickups, bodies and scripts as at the arrival; the partners follow).
; 0: the next run arms on the map as it is. Campaign arenas reload their checkpoint too.
RestartOnGameOver=1

; Where enemies may appear: on the nav mesh, out of every player's and bot's
; sight, MinDistance to MaxDistance metres from the player, within FloorBand
; metres of his height (floors above and below included), and reachable on foot
; within MaxPathFactor times the straight distance. OtherFloorBonus favours spots
; on another floor (0 treats all floors alike, negative prefers his own).
MinDistance=12
MaxDistance=25
IdealDistance=16
; Companion bots only need this much room, so spots near the player stay open.
BotMinDistance=8
FloorBand=12
; Room a direct spawn keeps from walls, in metres: closer spots are pushed into the open or
; dropped (a body against a wall can end up inside it). 0 = off.
WallClearance=0.3
OtherFloorBonus=2
MaxPathFactor=2.2
; Spawn point candidates tested per frame (nav query plus line of sight casts).
CandidatesPerTick=3

; Vent arrivals through the map's own slasher vents, rebound to a pool donor
; whose vent arrival matches (needs VentRebinding=1 in DS2Randomizer.ini).
VentSpawns=1
; Share of "any" spawns that try a vent first, in percent.
VentShare=40
; 1 = a vent in a player's sight is skipped. 0: enemies may come out of any vent,
; seen or not.
VentLineOfSight=0
; How far a vent may be from the nearest player or bot, in metres. VentMinDistance holds
; for one player; every further living player or bot takes VentMinStep off (5, 3, 1, then 0).
VentMinDistance=5
VentMinStep=2
VentMaxDistance=30
; 1 = enemies may come out of every open vent of the map (Marker Lab has 18),
; not only the five the map's own slashers use. Vents behind doors the map has
; not opened yet stay shut either way.
VentAnyMarker=1
; A wall vent more than this many metres above the walkable floor below it is left
; to the necro players (the MP maps' high wall vents). 0 = no limit.
VentMaxAbove=2.5
; 1 = only vents whose floor the players can walk to. A vent on a catwalk with no way
; down (the necro players' perches) stays shut, however low it sits on that catwalk.
; Its walk also counts: a vent whose walk is longer than MaxPathFactor times its
; distance (a corridor beside the players', Marker Test-Bed) is used only when no other is left.
VentMustReach=1
; Catch-up: an enemy farther than CatchUpMeters from every living player is taken away
; and comes back near them (vent or direct spawn). With four real players the distance
; is CatchUpMetersFour (bots do not count). Not in Versus, never for Brutes or the
; Ubermorph. CatchUpSeconds: how long it must stay that far first, 0 = at once. 0 m = off.
CatchUpMeters=50
CatchUpMetersFour=40
CatchUpSeconds=0
; 1 = no Stalker on a map without cover points (the MP maps, most arenas): it hides
; and peeks from them and only stands around without. Its substitutes come instead.
StalkerNeedsCover=1
; Donors of other families may use a slasher vent when their arrival matches.
VentCrossFamily=1
; Families switched off in [VentFamilies] of DS2Randomizer.ini may still use
; these vents (the four floor vents only fit a Lurker). The learned per record
; blocklist still applies.
VentIgnoreVentFamilies=1
; One vent, and one slasher spawner, takes one enemy every this many ms (3000 at least).
VentGapMs=3500
; A "vent" entry that finds no free vent this long goes direct.
VentWaitMs=15000

; Hunting. Every enemy knows where the players are (renewed every
; AwareRefreshMs). Templates that track nobody (leaper, security slasher,
; slasher_var1) get the player group back. MaxChargers lets that many enemies
; charge at once (the game allows 1; 0 leaves it). Slashers run with at least
; ZombieChargeFloor chance. ZombieChargeIgnoreVis=1 lets them start a charge off
; the player's screen too (0: only on screen, as in the game). Template changes
; and the charger limit are undone when the run ends.
ForceAware=1
AwareRefreshMs=3000
RepairBlindTemplates=1
; How far the enemies keep track of the players during a run. Most templates stop at 30 m,
; and an enemy that loses the players wanders about until the catch-up takes it away. Never
; less than CatchUpMeters + 10. 0 leaves the templates as they are. Undone when the run ends.
TrackMeters=80
MaxChargers=2
ZombieChargeFloor=0.9
ZombieChargeIgnoreVis=0
; No survival enemy plays dead (lies down when it loses a limb, gets up later).
NoPlayDead=1
; Charge without seeing the target: 0 off (as in the game), 1 in the campaign arenas
; (their corridors hide the players, so slashers walked up), 2 on every map. Undone
; when the run ends.
ChargeUnseen=0

; Watchdog: an enemy that made no progress toward any player for StuckSeconds,
; still sits in a vent after VentStuckSeconds, or never built a state machine
; after InertSeconds is killed or written off so the wave can end.
StuckSeconds=60
VentStuckSeconds=30
InertSeconds=20
; An enemy that has not moved a metre for FrozenSeconds (stuck in a wall next to a
; player, where it still counts as engaged) is taken away and comes again. 0 = off.
; Lurkers, Pukers and Stalkers are left alone.
FrozenSeconds=15
EngageMeters=10
; A timed wave kills what is left of it when the timer runs out.
TimedEndKill=1
; Super variants (super slasher and others) as donors.
SuperVariants=0
; Percentage of slashers / pregnants that come as their Severed counterpart
; ([DS2Randomizer] Twitchers=1). 0 = never.
TwitcherPercent=20
SeveredPregnantPercent=20
; No spawn while the NavPower pool has less than this left in its top chunk.
NavPowerReserveKiB=96

; Rewards after each wave, dropped at the spawn point nearest the player:
; ammo for every gun he carries, med packs (0 small, 1 medium, 2 large),
; credits and stasis packs.
RewardAmmoPerGun=2
RewardMedPacks=1
RewardMedPackSize=1
RewardCredits=1000
RewardStasis=1

; After the last wave: every BossEvery-th wave repeats the boss wave, the
; others cycle through EndlessCycleFrom..EndlessCycleTo with counts grown by
; EndlessGrowthPercent per wave past the last one.
EndlessCycleFrom=4
EndlessCycleTo=9
EndlessGrowthPercent=20
BossEvery=10

; On-screen text through the co-op plugin's RIG notice.
Notices=1
NoticeGapMs=4000
; At this many enemies left in a wave (nothing more to spawn), every one still alive is
; marked on everybody's screen with its distance, so a stuck one is found. 0 = off.
ShowLastEnemies=3
; 1 = wave, enemies left and the break's countdown as one small line at the top
; centre of the co-op plugin's overlay ([Hud] in DS2United.ini), events for a few
; seconds under it; the RIG notices then stay off. Without the overlay the RIG
; notices are used.
Hud=1
; Bounded per-spawn log lines.
LogSpawnLines=300

[Mercenaries]
; The clock mode, picked with up/down in the map picker (DS2United.ini [Menu]).
; No waves and no breaks: enemies keep coming and grow stronger, the clock runs
; in game time (the pause stops it). When it reaches zero the run is over.
StartSeconds=150
StartDelaySeconds=3
; The clock never holds more than this.
MaxSeconds=600
; Time per kill, and per elite (enhanced variant or a heavy), in ms.
KillMs=1000
EliteKillMs=5000
; Kills less than ComboWindowMs apart chain; every ComboStep-th chained kill adds
; ComboBonusMs. Every 10 chained kills raise the score multiplier (up to x5).
ComboWindowMs=3000
ComboStep=10
ComboBonusMs=10000
; Time capsules: glowing stasis packs across the map, by open vents (never behind
; a door the map has not opened), at least CapsuleMinMeters from every player and
; drawn from the farther spots. Capsules is how many stand at once, CapsuleTotal how
; many a run gets in all (0 = no limit). Picking one up adds CapsuleMs;
; GoldenPercent of them are golden and add GoldenCapsuleMs. One not taken in
; CapsuleLifeSeconds moves elsewhere.
Capsules=2
CapsuleTotal=8
CapsuleMinMeters=20
CapsuleMs=30000
GoldenCapsuleMs=60000
GoldenPercent=15
CapsuleLifeSeconds=75
CapsuleGapMeters=12
; Every time bonus (kills, combos, capsules) shrinks as the run goes on: full at
; the start, BonusFloorPercent of it after BonusFadeSeconds and from then on. A
; run ends after MaxRunSeconds whatever the clock says (0 = never).
BonusFadeSeconds=480
BonusFloorPercent=20
MaxRunSeconds=900
; A death costs this much time (the dead player is back after [Respawn] DelayMs).
DeathPenaltyMs=15000
; This many kills end the run early as a clear; every second left then scores
; ClearBonusPerSecond. 0 = no clear, only the clock.
KillTarget=150
ClearBonusPerSecond=100
; Supplies (as at a wave end) every this many kills. 0 = none.
SupplyEveryKills=30
; The last FinalSeconds bring FinalEnemies once.
FinalSeconds=60
FinalEnemies=Hunter:1:direct, Stalker:4:direct:2, Pregnant:1:direct
; How long the result stays; then the map reloads from its checkpoint (1) or the
; next run arms on the map as it is (0).
ResultSeconds=20
RestartAfterResult=1
; Score needed for each rank (below RankC is D).
RankC=20000
RankB=40000
RankA=70000
RankS=100000
RankSS=150000

[Objective]
; The MP map's own objectives against the hordes, picked with up/down in the map
; picker (DS2United.ini [Menu]); only on the multiplayer maps. The enemies keep
; coming and grow stronger, like Mercenaries; the map's objective chain is the
; goal, and the clock (game time, the pause stops it) keeps anybody from camping.
StartDelaySeconds=3
; The clock starts at the map's own round time times this percent (Titan Mines
; and Escape 240 s, the others 180 s, Concourse and Academy 120 s); 100 = as in
; an MP round.
StartPercent=100
; The map's own time bonuses (an objective step adds or sets the round clock)
; count this percent of their seconds.
BonusPercent=100
; Every objective done adds this on top, also on maps without their own bonus.
StepBonusSeconds=30
; After every objective done the clock holds at least this much (0 = off), so a
; map with few bonuses of its own (Marker Lab has one) leaves time for the next.
StepFloorSeconds=90
MaxSeconds=1800
; A death costs this much time (the dead player is back after [Respawn] DelayMs).
DeathPenaltyMs=10000
; After every objective: no new enemies for this long (0 = none), supplies for
; everybody (1), and this many more stages join the queue.
BreatherSeconds=0
SuppliesPerObjective=1
StagesPerObjective=1
; How long the result stays; then the map restarts from its checkpoint (1), so
; its objectives start over. 0: the map stays as it is, quit to play it again.
ResultSeconds=20
RestartAfterResult=1
; Defend phases (Titan Mines' bench, Fuel Core's fuses and detonator): AI enemies
; never hit a prop by themselves, so every enemy within DefendRadius metres of a
; target the map has made vulnerable does this much damage per second to it.
; The bench has 1200 health, the fuses 500..600, the detonator 1000. 0 = off.
DefendDamagePerSecond=12
DefendRadius=4
; Objective props (every prop you destroy or defend: Marker Lab's node and
; markers, Titan Mines' bench, Fuel Core's fuses and detonator, the Concourse
; glass, Academy's breaker box and scoreboards) last this many times as long,
; whoever hits them, at any team size. 1 = as authored. Read on every machine:
; keep it the same for everybody.
PropHealthFactor=3
; Each real player beyond the first makes the hold switches ("hold E") take
; this many percent longer: 50 = solo as authored, 2 players x1.5, 3 x2, 4 x2.5.
; Bots never count. 0 = always as authored. Read on every machine.
HoldPerPlayerPercent=50
; The Contact Beam's hits on objective props count this many percent, in
; Objective and in Versus (50 = half; 100 = as authored). Read on every machine.
ContactBeamPercent=50

[Zone]
; Hold the Zone, picked with up/down in the map picker; only on the multiplayer
; maps. One zone at a time: stand in it to fill it while the hordes keep coming.
; A full zone adds time, drops supplies, brings stronger enemies and moves
; elsewhere. The clock (game time) running out ends the run; the score is the
; zones held.
; Where zones appear: only at the spots in DS2Zones.txt, recorded in the game
; with [Zone] RecordKey. On a map without spots the clock stands until one is
; recorded. Inside means within the radius, 0.5 m below to 1 m above the spot.
StartDelaySeconds=3
StartSeconds=150
MaxSeconds=600
; Added for every zone held.
BonusSeconds=60
; A death costs this much time.
DeathPenaltyMs=10000
RadiusMeters=4.5
; Seconds to fill a zone alone; every more player inside (bots too) adds this
; percent of the speed.
CaptureSeconds=30
TeamSpeedPercent=50
; With nobody inside the zone drains at this percent of the capture speed (0: it
; keeps what it has). This many enemies inside stop it (contested).
DecayPercent=50
ContestEnemies=2
; Supplies for everybody (1) and this many more stages for every zone held.
SuppliesPerZone=1
StagesPerZone=1
; Zones to win the run; 0 plays until the clock runs out.
TargetZones=0
; The zone bonus shrinks as the run goes on: full at the start, BonusFloorPercent of
; it after BonusFadeSeconds and from then on, so the clock wins in the end. A run
; ends after MaxRunSeconds whatever the clock says (0 = never).
BonusFadeSeconds=600
BonusFloorPercent=20
MaxRunSeconds=720
; How long the result stays; then the map reloads from its checkpoint (1) or the
; next run arms on the map as it is (0).
ResultSeconds=20
RestartAfterResult=1

[Cleanup]
; What would pile up on the MP maps and in campaign arenas in a long run (every mode,
; every machine).
; Times are game time: nothing is removed while the game is paused.
; The watchdog's stuck enemies never tick, so their corpses never fade: deleted
; this long after the kill, unless a player is within StuckCorpseKeepRadius metres.
StuckCorpseDelete=1
StuckCorpseDelayMs=3000
StuckCorpseKeepRadius=10
; A corpse, limb or item told to fade away whose fade has not moved for this long
; is deleted the way the game deletes it at the end of a fade.
FadeSweeper=1
FadeStallMs=3000
; Drops, rewards, ammo and credits lying on the map: above MaxPickups the oldest
; fade out, but never one younger than PickupMinAgeSeconds or within
; PickupKeepRadius metres of a player or bot (above PickupHardMax the radius no
; longer protects). Capsules are never touched.
PickupCap=1
MaxPickups=40
PickupHardMax=80
PickupMinAgeSeconds=60
PickupKeepRadius=8

[MapFamilies]
; Which enemy kinds may come on a map. One line per map:
;   <map>=slasher, puker, pack      only these
;   <map>=-brute, -ubermorph        every kind but these
; A wave that asks for a kind left out gets its stand-in (pack for slasher, and so on).
; Kinds: slasher, pack, swarmer, leaper, stalker, puker, lurker, exploder, infector, tube,
; brute, pregnant, divider, ubermorph (the game's names Zombie, PackEnemy ... work too).
; Twitchers and oracles are slashers. Maps: mp_bombRun (titan mines), mp_escape, mp_solar,
; mp_detonate (fuel core), mp_gov (marker lab), pdlc_mp_mall (concourse), pdlc_mp_school
; (academy), arena_ch01, arena_ch03, arena_ch03b, arena_ch04, arena_ch05, arena_ch08,
; arena_ch09, arena_ch10, arena_ch11. No line: every kind.
;mp_bombRun=slasher, pack, puker, exploder, brute
;arena_ch10=-ubermorph

[Escalation]
; From FromWave on every wave hardens the run (wave 10, the boss fight, is the
; last normal one). The "per wave" values count the waves from FromWave on:
; wave 11 is step 1, wave 20 step 10.
FromWave=11
; Chance in percent per step that an enemy with an enhanced variant (Slasher,
; Leaper, Lurker, Puker, Stalker, Infector, Brute) comes as one, up to EnhancedMax.
EnhancedPerWave=5
EnhancedMax=60
; Of the enhanced slashers, oracle twitchers at most this share (percent) and this many
; alive at once; super slashers take the rest.
OracleShare=35
OracleMaxAlive=3
; Mercenaries, Objective and Hold the Zone add a stage whenever their queue runs dry, far more
; often than a survival wave ends: this many stages count as one wave for the escalation.
ClockStagesPerWave=3
; Their chance of an enhanced variant (super slasher, oracle twitcher) stays at or below this,
; a boss stage's own Enhanced= included.
ClockEnhancedMax=25
; Health, and the health of every limb, in percent per step, up to HealthMax in all.
HealthPerWave=3
HealthMax=60
; Movement and attack speed in percent per step, and its cap.
SpeedPerWave=1
SpeedMax=40
; The break between waves gets this many seconds shorter per step, down to the
; minimum.
PauseStepSeconds=0.5
PauseMinSeconds=8
; MaxAlive above is for one player; every further player (partners and bots)
; adds this many, up to the cap (15, 18, 21, then 23 with four).
MaxAlivePerPlayer=3
MaxAliveCap=23
; Wave rewards shrink by this percent per step, down to the minimum.
RewardStepPercent=2.5
RewardMinPercent=40
; Shop prices grow by this percent per step, up to the maximum.
PriceStepPercent=0
PriceMaxPercent=200
; What the companion bots' hits do, in percent: shrinks by the step, down to the
; minimum. Their ammo stays infinite.
BotDamageStepPercent=1
BotDamageMinPercent=50
; Stasis resistance of the Ubermorph and the Brute: this much more for every boss
; wave reached (BossEvery), up to the maximum.
BossStasisResistPerBoss=20
BossStasisResistMax=80

; Waves. Enemies = Family:count[:path[:pack]], comma separated.
; Families: Zombie (slasher), PackEnemy, SwarmEnemy, Leaper, Stalker, Puker,
; Lurker, Exploder, Infector, TubeBeetle, Brute, Pregnant, DividerCore,
; Hunter (Ubermorph). Path: any (default), vent or direct. Pack: how many
; arrive together at one spot. A family the map cannot field is replaced by
; one of a similar role (logged). Optional per wave: MaxAlive,
; SpawnIntervalMs, TimeLimit (seconds; the wave ends on the timer), Pause,
; Enhanced (per cent of the enemies with an enhanced variant that come as one;
; the escalation's value is used when it is higher).

[Wave1]
Enemies=Zombie:6

[Wave2]
Enemies=Zombie:8

[Wave3]
Enemies=Zombie:10, PackEnemy:4

[Wave4]
Enemies=Zombie:12, Leaper:4, Puker:3

[Wave5]
Enemies=Brute:1:direct, Exploder:6, Zombie:4

[Wave6]
Enemies=Lurker:3, Infector:2, Stalker:2:direct:2, Zombie:6

[Wave7]
Enemies=Lurker:4, Infector:3, Stalker:3:direct:3, Zombie:8

[Wave8]
Enemies=Pregnant:2:direct, Puker:4, Exploder:4, Zombie:6

[Wave9]
Enemies=Brute:2:direct, DividerCore:1:direct, Zombie:8, Leaper:4, Puker:3

[Wave10]
; The boss wave: the Ubermorph with an escort. Heavies first (two Dividers, a
; Pregnant whose swarm bursts out), Stalker pairs from the flanks, Lurkers and
; Pukers at range, Exploders to blow the Ubermorph apart with, and half of
; everything that has an enhanced variant comes as one. It ends on the timer.
Enemies=Hunter:1:direct, DividerCore:2:direct, Pregnant:1:direct, Stalker:4:direct:2, Lurker:3, Puker:3, Exploder:4, Leaper:4, Zombie:10
Enhanced=50
MaxAlive=14
SpawnIntervalMs=2500
TimeLimit=120

[ProgressXp]
; Profile XP the director pays (the co-op plugin books it, [Progress] there), on
; the retail multiplayer scale: a necromorph kill 100, a human kill 300, a round
; won 1000, both rounds +2000. A kill pays KillXp (Brute, Pregnant, Divider
; HeavyKillXp, the swarm babies SwarmKillXp; twice for an enhanced one), a cleared
; wave WaveXp times the wave (up to WaveXpCap; wave 10 = a won round), a boss wave
; BossXp more. The clock modes pay their result instead.
KillXp=100
HeavyKillXp=300
SwarmKillXp=25
WaveXp=100
WaveXpCap=40
BossXp=2000
MercenariesScoreDivisor=8
ObjectiveStepXp=500
ObjectiveClearXp=3000
ZoneXp=500
