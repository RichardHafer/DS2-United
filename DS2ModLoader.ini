; DS2ModLoader: loose-file mods for Dead Space 2. Goes to plugins\DS2ModLoader.ini.
;
; The game searches its DS2DATn.DAT archives first and the game folder second,
; so a loose copy of an archived file is never seen. This plugin puts every
; folder under <game>\mods in FRONT of the archives:
;
;   mods\MyMod\<path exactly as inside the DAT>   e.g. mods\MyMod\audio_char_streams\exploder_audio.str
;
; Folders are searched alphabetically; mods\order.txt (one folder name per
; line, first line wins) sets the priority. A folder whose name starts with
; '-' is ignored. Log: plugins\DS2ModLoader.log lists the final search path.
[Mods]
Enabled=1
Folder=mods
; 1 also puts the game folder itself before the archives (a loose file next to
; the exe, without a mods folder, replaces the archived one).
LooseFilesFirst=0
