; Writes a line per spawn to the log.
ObserveSpawns=1
; Buffer for detailed spawn lines between two log writes.
DetailedSpawnLimit=2048
; Read-only snapshots every five seconds, up to 60 reports.
StreamRegistryDiagnostics=1
; Logs stream changes continuously (read-only).
StreamWatchDiagnostics=1

