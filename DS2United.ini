MoreEnemiesVents=1
; Loads the shared enemy pool, so an enemy can appear in a level that does not ship it.
GlobalTemplates=1
; Requests the enemy pool at the start of every level.
GlobalStreamProbe=1
; The loading screen stays at least this long.
MinimumLoadingSeconds=0
; 0 = uncapped.
FpsCap=0
; Watches the enemies the randomizer created: repairs their state tables and deals with ones that never come ...
Watchdog=1
; Kills a stuck enemy through the game's own death path, so its drop and any door counter still fire.
WatchdogKill=1
; An enemy whose time is up while it holds someone in a grab, is held itself or stands within
; WatchdogSpareMeters of a player is looked at again 15 s later instead of removed.
WatchdogSpareFights=1
WatchdogSpareMeters=3
; A shorter timeout for enemies that came through a rebound vent, the ones that get stuck most.
