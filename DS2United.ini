[Dementia]
; Experimental. A sanity meter for your own Isaac: fighting alone (no partner or bot within
; AloneMeters) fills it, staying together drains it. Its stages bring hallucinations that only
; you see and hear: whispers and a faint vignette, then flicker, glitch bands, Nicole's lines and
; false RIG warnings, then heavy flicker, a heartbeat and the partner "lost", at last a
; freakout. Nothing is sent to the partners. Sounds come from plugins\dementia (WAV files).
; Only with a human partner in the game: solo, with bots or without, there is no Dementia.
Enabled=0
; survival = survival games only, all = story co-op too
Modes=survival
AloneMeters=15
; seconds alone from a clear head to the last stage, and together back to clear
RiseSeconds=150
FallSeconds=40
; 1 = bots count as company
BotsCount=1
; how often hallucinations come, in percent (200 = twice as often)
Pace=100
; 0 = no full blackouts and no white flashes (gentler on the eyes)
