; Configuration for the standalone campaign co-op plugin (DS2United.asi).
; Separate from DS2Randomizer.ini on purpose: the two plugins share no keys.
; Port/Peer normally come from the DS2COOP environment variable set by the
; DS2_Coop_Host.cmd / DS2_Coop_Client.cmd launchers.

[Coop]
; The pause menu does not stop the world while a partner is connected (as in a multiplayer match).
PauseKeepsRunning=1
; Pause menu: tutorials and friends list always locked; checkpoint restart only for the host
; (or a solo player), a partner sees it locked.
PauseMenuLocks=1
; A scripted teleport of a human (SimpleTeleport, scripted sequence) moves the necro ghost camera along.
TeleportFollow=1
; The Patrol Suit wears Gabe Weller's own helmet from Severed (randomizer\ds2_severed_patrol).
PatrolWellerHelmet=1
; Room lights switched by script (AnimateLight on/off) are shared between the players by GUID.
LightSync=1
; A Hunter (Ubermorph) that regrows its limbs on the host regrows them on every client too.
ShareRegeneration=1
; An enemy goes for the nearest player it has noticed, not the one it noticed first.
NearestTarget=1
; Key that puts your Isaac next to the partner (where he stood a moment ago) when the level
; cut you off, e.g. a barrier built for one player. With more players each press goes to the
; next partner who is not already next to you. 119 = F8, 0 = off.
CatchUpKey=119
; Windows may not slow this game down while its window is in the background (timer resolution, power throttling).
BackgroundFullSpeed=1
; The game pins its main threads to core 0, so two copies on one PC share that core and the
; unfocused one drops to a few FPS. 1 = every pin gets all cores (default: as BackgroundFullSpeed).
UnpinThreads=1
; 1 = while another window has the focus this copy ignores keyboard, pad and mouse (two copies on one
; PC otherwise both act on every key). Default: as BackgroundFullSpeed.
FocusInputOnly=1
; Logs every sound-named message (aud_, music, ambience, loops) with how it arrived.
AudioTrace=1
; Ghost movement (the partner's Isaac, the host's enemies) keeps the sender's timing:
; each received position is placed on the sender's clock instead of its arrival time,
; so network jitter no longer makes ghosts lurch. The engine's own smoothing stays.
GhostTimeline=1
; Player-only network candidate. Not validated in game.
Enabled=1
; Wait this long after the game image is ready before installing hooks, so other
; plugins that verify retail bytes (the DS2 Debug Menu) bind first.
InstallDelayMs=3000
; Network co-op between several copies of the game. 0 = companion bots only:
; no network session is started and AutoStart/StartKey are ignored.
Network=0
; The main menu's "host co-op" / "join co-op" ([Menu] Enabled=1) switch the
; network on for that game without this key. JoinAddress is the host's address
; and game port (its Port=), e.g. a Tailscale address: 100.101.102.103:27015.
; The host needs nothing. Ports used: Port (game), Port+1000 (side channel),
; Port+2000 (menu lobby), all UDP.
JoinAddress=
AutoStart=1
; Key that starts the session by hand (AutoStart does it anyway). 0 = none; F9 belongs to the bot.
StartKey=0
TickMode=2
RequirePeerReady=1
GhostFactoryProbe=1
ProtectLocalSave=0
GhostWeaponProbe=1
; A partner's ghost with empty hands is handed its last weapon again.
GhostGunReequip=1
GhostPlayer=1
; The suit hooks behind this go in when the first partner connects, not at
; start: solo they would rewrite ChangeToUniform and the debug menu then
; refuses every suit change with binding_mismatch.
MPUniformStreams=1
SyncOnlyPlayers=0
SyncAllObjects=0
HostNPCs=1

; A partner that sends nothing for PeerTimeoutMs loses his seat and his vote.
; The engine gets the same deadline, ends the connection itself and removes
; the partner's body. Local stalls (loading screens) are not counted, and a
; partner still connecting is never dropped. Values below 10000 are raised to 10000.
PeerTimeout=1
PeerTimeoutMs=30000
PeerTimeoutStallGraceMs=1000
PeerTimeoutDropsSeat=1
PeerTimeoutTunesEngine=1
; Drops entries from the aiming registry whose objects were freed without
; their destructor (crashes 0x00EA3D6D and 0x00737863).
AimRegistryGuard=1
; An enemy spawned inside a scripted sequence (the stasis-room necromorph that
; grabs Isaac) is spawned on every machine, not only the host: ghosts do not act
; in sequences. Window after the last sequence cue, in ms.
ScriptedSpawnsLocal=1
; Damage on a world object (no net proxy, authored GUID, e.g. the decompression
; button) is reported to everybody, who take the same health off their copy.
WorldHits=1
; Hits on props, vent covers, containers and destructibles (IDamageable) are
; replayed on every machine through the engine's own reflected-damage path,
; so a vent shot open on one machine breaks on all. Both machines need it.
WorldPropHits=1
; The Tormentor's arm (ch03): after every hit its arm health goes to the
; partners, and a Tormentor in the same grab takes the lower value, so every
; machine's grab ends together. Both machines need it.
ShareTormentorArm=1
; An unhandled crash writes deadspace2.crash.<pid>.dmp and a .txt with the address and
; registers (C:\DS2CrashDumps when that folder exists, else the game folder), and a copy
; of the session's log as deadspace2.crash.<pid>.log.
CrashDumps=1
; 1 = the dump holds the whole game memory (1.2 to 1.4 GB). 0 = a small dump of a few MB,
; and the game folder keeps the last three crashes. Empty: full only with C:\DS2CrashDumps.
CrashDumpFull=
; The bug key (BugReportKey, a virtual key code; 123 = F12, with Ctrl while BugReportCtrl=1)
; saves one folder bug_<time>_<id>_m<machine>_<pid> in C:\DS2CrashDumps (else
; plugins\DS2BugReports): every log and its kept runs, the INIs, a screenshot, a dump of
; every thread and a note with role, map, position and peers. Every partner saves his own
; folder under the same id. It works while the game hangs. BugReportFullDump=1 writes the
; whole memory instead (about 2 GB).
BugReport=1
BugReportKey=123
BugReportCtrl=1
BugReportFullDump=0
; On joining, every machine compares this file and its plugin build with the
; others and says on screen whether they match; DS2United.log lists each shared
; setting that differs. Key bindings, names, addresses and display options are
; left out.
ConfigCheck=1
; The host sends every machine its full partner table, so with three to eight
; players everybody dials everybody (TNL hands no body on through the host).
MeshRoster=1
; Clients play the host's [DS2Randomizer] Seed while they are in its session
; (enemy picks and blueprints; the bench keeps the own seed).
SeedSync=1
; Logs the aiming laser of the own gun (its handles and loaded ammo) on every change and
; every reload start, to find why it stays on or red after a reload. Log only.
LaserDiag=1
; A lift button (inside or outside the cabin) waits until every partner
; stands in the lift cabin (LiftWaitMs, default 60000, then it goes anyway).
LiftWait=1
; Diagnostics for the checkpoint-load render stall: every stream request made
; while no level is up is logged with its caller (coop_renderstall load_probe).
StreamLoadProbe=1
; TNL ghost update rate. The game's default is 96 ms (10 Hz) at 2500 B/s (the
; console lobby numbers). 32 ms is ~30 Hz; the packet is ~240 bytes.
NetRate=1
NetSendPeriodMs=32
NetBandwidth=12000
ScriptedSpawnWindowMs=3000
; NeutralNPCs (story actors like Edgar) are spawned and kept by every machine;
; the host does not ghost them, so the host's own room triggers cannot
; change them for a partner. Both machines need the same value.
NeutralNPCsLocal=1
; A partner's copy of a grab that unpacks before its defender's body waits for good:
; the game compares the arriving body with the attacker twice (0x010E2A89). 1 = fixed.
PairDefenderWaitFix=1
; A partner's new body (respawn, necro transform) resets the ghosting to him; during a
; grab that reset tore the grab apart. 1 = the reset waits for the grab (at most 12 s).
ReghostWaitsForGrabs=1
; 0 = a partner's team switch (necro and back, a watched scene) resets no ghosting: his world
; stands, and a reset left every enemy invisible on his screen for seconds.
ReghostOnTeamSwitch=0
; A client's own progress (credits, power nodes, guns, items, suit, bench nodes): kept per
; host in plugins\DS2ClientProgress\host_<id>.ds2client, written when it would save, when the
; host saves, before a level change and every two minutes, given back at the next session
; with that host. Every machine also keeps Isaac's state across a necro transform. The
; host's id lives in DS2Profile.ini [Coop] HostId.
ClientProgress=1
; How long after the level starts the saved progress is given back the first time (ms).
ClientProgressFirstApplyMs=1000
; Sound occlusion of the host's enemies on the other machines: 1 tests line of sight
; only (their navigation state lives on the host), 2 never muffles them, 0 is the game's own.
GhostOcclusion=2
; Classes every machine spawns and runs itself instead of receiving the
; host's ghost. NicoleBoss: her state machine (fade out, marker heart,
; teleports) only runs on a non-ghost, so each machine fights its own Nicole
; and her hits are shared, a lethal one on either side ends her phase on both.
; Both machines need the same value. Empty = off.
LocalNPCClasses=NicoleBoss
; A client that spawned a sequence's NeutralNPC itself (ScriptedSpawnsLocal)
; hides the host's ghost of it while its own copy exists (the second
; Tiedemann after the ch11 insider scene).
HideNeutralGhostTwins=0
; Hacking panels, power node doors and the eye poke machine are one player's at a time:
; whoever starts one claims it, and a partner's use of the same machine is refused
; ("A PARTNER IS USING THIS") until he walks away from it.
; Both at the train's panel at once crashed the partner (13.10.). Both machines need it.
PanelLock=1
; The host owns every enemy, so the engine refuses to broadcast damage the
; client deals: DirectSendDamageEvent bails when the shooter is not the owner.
; This tells the host what the client hit, and the host takes that much health
; off through the engine's own SetHealth, the same call the randomizer's
; watchdog has been making in production. The amount is measured as the health
; that went away locally, not parsed out of the damage struct. ApplyHits=0
; leaves it at reporting only. New 2026-09-17.
ReportHits=1
ApplyHits=1
DeathSync=1
; When a partner dies, put this player through the game's own campaign death
; as well, so everybody restarts at the same checkpoint instead of drifting
; apart. Verified offline: the campaign branch is taken (multiplayer flag
; clear), and the mirror calls the original function through the trampoline,
; so a mirrored death cannot be relayed back (no cascade, by construction).
; The death message is acknowledged per partner and retried until it is, or
; for 15 s at most (2026-09-17).
MirrorDeath=1
SuitSync=1
; Load a partner's suit when it is not already resident here, through the
; game's own ChangeToUniform (which registers, counts the activation and
; loads the stream in the right order). With this off, a partner wearing
; anything this machine has not loaded is simply refused, which is what
; made the second suit change on 2026-09-17 never arrive.
SuitStream=1
LoadoutSync=1
; Hand the ghost the weapons its owner carries, through the game's own
; requisition call. Needs LoadoutSync=1. New 2026-09-17, untested in game.
ProvisionWeapons=1
; Fold the ghost's helmet open or closed the way its owner's is (Player flag
; bit 0x17, set through the engine's own Player::SetFlag). New 2026-09-17.
HelmetSync=1
; The partner's ghost carries the same GUID as your Isaac; a script that asks
; for the Player by GUID gets your Isaac, never the ghost (cutscene camera, crash 16:28).
GhostGuidRedirect=1
; Ghost Players do not pull triggers in your world.
GhostsIgnoreTriggers=1
; Experimental: a partner's ghost does not count for the level's trigger volumes either
; (TriggerPhysical). Off: the ghost walks into them like the partner does at home.
GhostTriggerFilter=0
CheckEnemyTemplates=0
GhostSkeleton=0
Standin=0
Port=27015
Peer=

[Gate]
; Nobody rides the elevator alone. A message whose listeners would take the
; player somewhere (a scripted sequence, a one-way door, a mover, a checkpoint)
; is held until every player's own copy of the level fired it too, each of
; them still standing where they fired it. Then it is replayed. If somebody
; never turns up, the timeout lets it through: the gate can delay progress,
; never lose it. Alone, nothing is held.
Enabled=1
; One log line per held and released message, and per hash first classified
; as progression. Leave on until the class lists below have been played in.
Trace=1
; With a partner connected the hold is meant to last until he arrives; this is
; the safety valve only. The partner is told on screen how far away he is.
TimeoutMs=180000
; A partner silent this long no longer counts for the quorum. With partners
; configured but none ever connected, after this long nothing is held (as in solo).
PeerGraceMs=60000
; How far (metres) a player may move from where he voted before his vote
; stops counting. Shifting your feet in the lift is fine; the corridor is not.
DriftLimit=6
; Only a message SENT by something a player did is held: a trigger he walked
; into, a door he used, a lift, an area coming in. Anything sent by a spawner,
; a counter or a sequence controller is a consequence and goes through (the
; partner could never produce it himself and would be waited for in vain).
; OFF: in the 18:21 run it let everything through (area loads, checkpoints and
; doors are not sent by these classes). Opt-in until the source vtables in the
; hold lines say which classes to list.
SourceRule=0
Sources=TriggerBase,Player,StandardDoor,SimpleOneTimeDoor,Mover,MoverController
; Boxes a player steps into that start a ride nothing else holds (the small
; lift on the drill machine): held until every player stands in the box.
; The list comes from tools/coop_ride_triggers.py.
RideTriggers=1
SourceNodes=StreamSet,Checkpoint,LevelChange
; A held ScriptedSequence waits at most this long (the partner may never be
; able to produce an enemy's intro that only the host's enemies start).
SequenceTimeoutMs=20000
; Messages never held, by name or 8-digit hex hash (see the log's hold lines:
; "coop_gate hold hash=... name=..."). Comma separated.
Exempt=
; Ghosts pull triggers: a partner's ghost standing in your world fires your
; trigger volumes too, so a message firing here is no proof that YOUR Isaac
; reached anything (15:2x run: every gate "quorum" within 100 ms). When the
; message's source is a trigger entity, your own vote is cast only once your
; Isaac is within this many metres of it; the hold starts at once.
TriggerReach=10
; A player the group has waited for at a progression point this long (ms) is put where the
; partner stood (a barrier built for one player cut him off, he got lost). 0 = off.
PullToWaitingPartnerMs=20000
; Listener classes that arm the gate, asked by class hash so subclasses count.
; StandardDoor is deliberately absent: most doors open on approach, and
; gating those means waiting at every doorway. Add it here to try.
; ScriptedSequence is no longer held: sequences are shared through the mirror
; (see [Mirror] AnyClasses), whoever fires one.
Classes=SimpleOneTimeDoor,Mover,MoverController
; Level script nodes, matched by vtable. StreamSet is NOT held here any more
; (22:3x): the [Streams] rule holds a client's stream ACTIVATION while it would
; drop a stream shared with the host, and doors stay open while players are
; on both sides (the Dead Space 3 door). Holding the load-complete
; message on top of it left the host 95 s at an open door behind a client who
; had that room loaded long ago (his vote stood too far away).
; MultiManager only together with SourceRule=1 (a relay fires for host-only
; reasons too, and without the source rule every one of them would wait).
Nodes=Checkpoint,LevelChange

[Checkpoint]
; The clients restart where the host restarts. Every change of the death
; restart point (checkpoint triggers and kiosk saves alike) goes through one
; engine call; on the host that call is announced, on a client it is refused
; and the host's checkpoint is applied instead, once that checkpoint object
; exists here. Seen 2026-09-17: a client that had saved at a kiosk came back
; at the kiosk while the host came back at a game checkpoint.
Enabled=1
FollowHost=1
; When the host restarts from checkpoint (pause menu, death), the clients restart
; too, unless they restarted themselves in the last ten seconds (death mirror).
FollowRestart=1
; Before a client's restart the death checkpoint is set to the host's newest one if it never
; got applied here (its object was not found), so every machine loads the same checkpoint.
HostCheckpointOnRestart=1

[Level]
; A client plays where the host plays. The host announces its map, stream and
; death checkpoint once a second; a client whose map differs requests the
; same level change the level script would (override checkpoint, then
; GameMainLoop::RequestLevelChange). After joining only a NEW map is
; followed, so the host crossing a checkpoint reloads nobody. Seen 2026-09-17
; with eight players: one instance started from another save and stood in
; another chapter for the whole session.
Enabled=1
FollowHost=1
; A client in the main menu whose session still runs follows when the host
; loads a level again (new game, load game); the menu's join item follows at once.
FollowFromMenu=1
; The follow from the menu never launches the host's map with an empty checkpoint while he
; plays a campaign arena (the client came in at the level's default start); any other empty
; one only after EmptyCheckpointWaitMs without a lobby launch (a host at a fresh level start).
SkipEmptyCheckpoint=1
EmptyCheckpointWaitMs=10000
; Nor does it replace a lobby, arena or debug menu launch requested here this many ms ago.
LaunchGraceMs=8000
; A client whose restart point is empty takes the checkpoint its level was launched with.
RestartPointGuard=1
; A story client in the main menu who chose join co-op comes in only with the host's next
; checkpoint restart (the host gets a notice), never into his running level.
JoinOnHostRestart=1

[Mirror]
; What happens in one world happens in all of them. Each machine runs its own
; copy of the level logic, driven by messages. A door opens for the Isaac who
; walked up to it and stays shut on everybody else's screen while his ghost
; clips through; an enemy's death message comes out of an enemy that exists
; only on the host, so a client's quarantine never counts. So every machine
; repeats the messages that move the world (Classes/Nodes: doors, movers,
; props) to all the others, and the host alone repeats the ones that
; count it (HostNodes: variable counters, objectives, logs). A receiver
; replays unless it fired the same message itself within DedupeMs.
; Messages whose name contains one of these stay on the machine that fires them:
; every machine fights its own Nicole, so a player's dementia phases are his alone.
LocalNamePatterns=dementia,nicole
; Always, not only in the finale: a save kiosk's restore script (*_mm_save_kiosk) runs
; only when a save made there loads; a partner's stream follow fired it mid-game.
AlwaysLocalNames=_mm_save_kiosk
; ...but only from the first message of the finale on (names containing one of these).
LocalNameScope=dementialand,dementia_land,ch11_dementia
Enabled=1
; One log line per hash first classified as world state and per replay.
Trace=1
DedupeMs=5000
; 0: only the host repeats the world. A ghost clipping through a door that
; is shut on your screen is cosmetic; a player up front being handed a way
; back by somebody behind is not. 1: every machine repeats doors and movers.
ClientsMirror=1
; The host repeats every message its FuncSpawns send (SpawnDone and the
; like). A client suppresses those spawns, so without this whatever hangs
; off them never happens there (ch11: Nicole's blue light).
SpawnerMessages=1
; Button prompts (TestInputEvent) in a followed scene: a follower drops his
; own success/failure and plays the leader's, so both pass or fail together.
PromptResultsFromLeader=1
; A scene's props spawned by its trigger (ch11: Tiedemann's javelin gun) are
; spawned on the follower too, once he follows the scene.
SceneProps=1
; A NeutralNPC spawned by one machine's script (the Tormentor scene's Unitologists
; and security men) is spawned on every machine. Needed with NeutralNPCsLocal=1.
NeutralNPCSpawns=1
; What the level expects from an enemy (its death message, health change, end of
; spawn, noticing the player) is sent by the host to everybody, whatever listens:
; the clients only have ghosts, which never send it (psec03: the Leaper door).
EnemyMessages=1
; MultiManagers are relayed again (excluded since 17.09.: they switched the partner's
; streams to the host's room). A partner's copy now sends only the targets that are
; neither dangerous (MultiManagerDropNodes) nor mirrored anyway (doors, props, sequences,
; dialogue, counters): lights, sounds, objectives, gates and further relays.
MultiManagers=1
MultiManagerDropClasses=PushCamera,PopCamera,SimpleTeleport,PlayerChangeState,FadeScreenFx,TestInputEvent,TentacleControl,PlayerAir
MultiManagerDropNodes=StreamSet,StreamScripter,MultiRemoveTarget,Checkpoint,LevelChange,FuncSpawn,VariableOperator,VariableWatcher,EquipCommand,PlayerHelmetCommand,ExecuteLuaScript,LuaSwitch
; The MP maps' objective chain (obj_N_new and each step's completion) goes to every
; machine and runs once per round there, from whoever fires it first; a late joiner
; replays the host's finished steps. Not on Hold the Zone visits.
MpObjectivesOnce=1
; An enemy spawn a client's world asks for (a trigger or chain he reached first) is played on
; the host, who owns the enemies; the host's own later pass through the same sender is dropped.
EnemySpawnsFromClients=1
; What the host's MultiRemoveTarget deletes of these classes is deleted on every client too
; (props and effects only; NPCs, players, pickups, triggers and streams never).
SharedRemovals=1
; Logs once per message and level what the local world fires but does not share (coop_gap lines).
GapTrace=1
RemovalClasses=ScriptableProp,DamageableProp,DismemberableProp
; The people of a scene the host removes go on every machine too, once your own
; Isaac's sequence is over (the soldiers at the start stood on for the client).
RemovalNpcClasses=NeutralNPC
RemovalNodes=ExecuteVFX
; Scenery of these classes deleted within DeleteRadius metres of a player (broken, faded out,
; removed by a script) is deleted on every partner too.
SharedDeletes=1
DeleteRadius=25
DeleteClasses=ScriptableProp,DamageableProp,DismemberableProp,BreakableContainer
; Choice A: a sequence that starts right after the local player's own switch/panel/machine
; use (shaft climb, kinesis panel, eye poke) is a personal action and pulls nobody along.
PersonalActions=1
; The result of such an action (eye poke finished, hack succeeded) is played
; on every machine, so the partner's world moves on with it.
ActionOutcomes=1
; The results of actions on kinesis receptacles, the solar puzzle, handles,
; switches and destructibles are shared by their sender: the partner's logic
; counts them too, and his own copy of the object does not count them twice.
; Results also heard by streams, checkpoints, cameras or Lua stay local.
; SourceClasses / SourceUnsafeClasses / SourceUnsafeNodes override the lists.
SourceShare=1
; World calls: host-side C++ setters that never pass a message, mirrored by
; object GUID. Today: VentMarker::SetCoverState (vent covers break on clients).
WorldCalls=1
; A door opening on one machine (state 4 of its state machine) opens the same
; door on every other, from whoever opened it. Streaming is governed separately.
DoorOpenings=1
; A door with players on both sides (within DoorReach metres) refuses to close
; until everybody is on one side; then it closes as usual.
DoorsStayOpen=1
DoorReach=30
; The Dead Space 3 door: a door opened here waits until every partner stands
; within DoorWaitReach metres of it (with an on-screen notice), then opens
; for everybody at once. After DoorWaitMs it opens regardless. This replaced
; the gate's StreamSet hold (22:3x), which waited on the wrong thing.
DoorsWaitForPartners=1
; With DoorsVote=1 the door takes votes instead of measuring distance: a
; partner counts as "at the door" once HIS world asked that door to open (he
; reached it). A vote is spent by the opening it produced, expires after
; DoorVoteTtlMs, and a checkpoint restart wipes them all, so a spawn right in
; front of a door opens nothing by itself, and walking back through a door
; needs everybody at it again. DoorsVote=0 uses DoorWaitReach instead.
DoorsVote=1
; A closing door asks its user's side again and corrects the side it remembers
; when a scene carried him through (logged with Trace). The leave set itself is
; chosen in [Streams] DoorLeaveFix.
DoorSideFix=1
; A partner's door opening loads the room on our side first (the door's own LOADING state),
; also when the door refuses our Isaac; only a door without open sets opens at once.
DoorReplayLoads=1
DoorVoteTtlMs=30000
DoorWaitReach=3
DoorWaitMs=180000
; Direct sends never mirrored (hex hashes): call_lua B2385537 and dismember_joint
; 368C9BF3 carry pointers that mean nothing on another machine.
; BF2F11C2 is the per-tick message to a ScriptableProp inside the player's own
; suit stream (uniadvanced.str, GUID ...-BROWN101): the RIG, not the world.
DirectExclude=B2385537,368C9BF3,BF2F11C2,359F0D10,4EC20370
; Messages repeated by whoever fires them, whatever listens (by name or hash):
; a sequence's "freed" cue here means one shooter frees everybody. And the
; ones never repeated. The log names every held/replayed message.
Include=
ExcludeHashes=
; Listeners that mean "the world changed": entities by class (subclasses
; count) and script nodes by vtable.
Classes=StandardDoor,SimpleOneTimeDoor,Mover,MoverController,DamageableProp,ScriptableProp,DismemberableProp,DrivenScriptableProp,LinearScriptableProp,SecondaryAnimScriptableProp,VentMarker,Switch,SimplePressAndHoldSwitch,PowerNodeSwitch,HackingStationMiniGame
; Animated and moving lights stay client side (each machine runs its own copy);
; MirrorLights=1 would send them again.
Nodes=
MirrorLights=0
; Counted things have one author: only the host repeats these.
HostNodes=VariableOperator,VariableWatcher,ObjectiveEntry,LogEntry
; Never repeated, whatever else listens: spawns stay the host's, streaming
; and checkpoints have their own modules, sequences belong to the gate, and
; relays/gates/Lua nodes are left alone because their outputs are mirrored:
; repeating the input too would fire the output twice, and on a counter that
; is a wrong number.
Exclude=
; Repeated by ANY machine, host or client: every scripted sequence cue, so a
; cutscene or a "freed" outcome fired on one machine plays on all. Opt single
; cues out with ExcludeHashes= (name or hash, from the log's replayed lines).
AnyClasses=ScriptedSequence,ScriptedEventSequence
; A story cue (sequence, scene dialogue) and a neutral NPC spawn play once per machine, from
; whoever fires them first. A player behind the group who walks into a scene the group
; already played runs nothing again and sends nothing, so the partners' NPCs do not restart
; it in an unloaded room (T-pose). A cue one machine fires twice counts as a repeat and stays
; shared. Forgotten on a checkpoint restart and a level change. Both machines need it.
StoryCuesOnce=1
; The host's record of what the group did since the checkpoint, replayed to a
; partner who arrives later: 0 off, 1 story and match modes, 2 match modes only.
; Story partners all load in together at the host's checkpoint restart.
Journal=2
; A relayed MultiManager drops every target a spawner, stream set or other dangerous class
; hears, and with it the other listeners of that target. With this on, such a target still
; reaches its MultiManager listeners (their own targets are filtered again). The ch02 tram
; station hallucination never ended without it. Both machines need it.
SplitDroppedTargets=1
; Scene dialogue (ScriptedSentence, PlayAudioStream) is started by a trigger in the room.
; Repeated from any machine so a player a scene pulled in hears them too;
; unlike AnyClasses they never wait for partners.
VoiceClasses=ScriptedSentence,PlayAudioStream
AnyNodes=
; Each scene cue carries its initiating stream set. All participants check
; that their completed set contains the required streams before playback.
; Catalogued shared player scenes wait for a ready vote from each supported participant.
; SequenceWaitMs limits the legacy wait for uncatalogued cues or older peers.
SequenceWaitsForStreams=1
SequenceWaitMs=90000
; A scene a partner's ghost starts here (he walked into its trigger, we did not)
; waits up to this long for his own copy, so the player who walked in leads it. 0 = off.
GhostSequenceHoldMs=20000
; While a local cutscene waits, the local Isaac is held where he stands (position put
; back every frame, animation clock stopped) so nobody walks past a cutscene
; that has not played yet. Undone the moment the cue is released.
SequenceWaitFreeze=1
; The other side of it: a partner's sequence cue that arrives while his room
; is not loaded here first activates his stream set and waits (FollowWaitMs)
; for it to load, so what the sequence shows exists on this machine.
FollowSequence=1
FollowWaitMs=10000
; MultiManager/MultiRemoveTarget are relays: the host's "enter lower room" replayed on a
; client switched the CLIENT's stream sets to the host's room (2026-09-17 14:55).
ExcludeNodes=FuncSpawn,StreamSet,StreamScripter,Checkpoint,LevelChange,EquipCommand,PlayerHelmetCommand,OrEventGate,AndEventGate,LuaSwitch,ExecuteLuaScript,MultiManager,MultiRemoveTarget

[Notice]
; How long a hint card (what happened, why, the fix) stays on screen, in seconds.
OverlayHintSeconds=5
; On-screen text through the RIG announcement (the "Schematic Acquired"
; banner): WAITING FOR PARTNER when the gate holds, PARTNER HERE / CONTINUING
; WITHOUT PARTNER when it releases, CO-OP PARTNER CONNECTED / LOST. The text
; table cannot grow, so a placeholder entry the export left in is borrowed
; (its hash below) and pointed at the plugin's text. Change SlotHash only if that
; placeholder ever shows up somewhere it should not.
Enabled=1
SlotHash=0B768C07
; Notices other plugins queue (the randomizer's survival waves) are shown one
; at a time, at least this many milliseconds apart.
QueueGapMs=2500

[Credits]
; The mod's own block at the start of the credits (main menu and end of the game). The
; original credits follow it unchanged. Title is one big line like "Dead Space 2", Role is a
; heading over Names (up to 8, separated by |), BlankLines (0 to 4) separates the block.
Enabled=1
Title=Dead Space 2 United
Role=Created by
Names=Richard Hafer
BlankLines=2

[Streams]
; A partner's ghost walking through a cull trigger in the local world does not hide or
; show the parts of the room the local player stands in (cull sets); the local Isaac still does.
GhostsIgnoreCullTriggers=1
; A set switch keeps the rooms a partner's set still holds (they are added to the local
; set's desired list) instead of waiting for him. PinNearM > 0 skips that for a partner
; within so many metres (he walks through with us); 0 = off. Off since 12.10. 20:29:
; at the start of an IGC the client kept nothing for the host 0 m away and crashed on
; the host's ghost animating from a dropped room. Rooms may linger one switch longer.
PinPartnerStreams=1
PinNearM=0
; Visibility and loads otherwise follow each player's own Isaac; a partner's rooms come
; along only for a teleport, a cutscene or a load together.
; A loaded room stays visible while any player's own game shows it: a partner who
; stayed behind in a big room is not left standing in parts the local triggers hid.
VisibilityUnion=0
; The room your own Isaac stands in is never hidden in co-op, whoever's trigger asks.
KeepOwnRoom=1
; A shut door hides the rooms on the side away from its user. When that user was a
; partner and our Isaac stands on the other side, the door's output still runs but
; its cull sets are dropped here, so the room we stand in is never hidden.
DoorCullsFollowUs=1
; The area = the last stream set that finished loading here. The host sends his
; once a second; a client in another area for five seconds is told on screen
; (DIFFERENT AREA THAN PARTNER) and the log says which set differs.
Compare=1
; The Dead Space 3 door rule: a stream set activation (door closing behind the
; leader, a lift, a script) that would drop a stream a partner is still in is
; held until every partner's set (or the set he is himself waiting for) fits
; inside it. The previous room stays loaded behind the leader until the others
; have followed. Works for any number of players. HoldTimeoutMs is the valve.
; Off since 12.10. (a continuous sync, see PinPartnerStreams).
HoldForPartners=0
HoldTimeoutMs=180000
; The streams follow the body: standing within FollowReach metres of the
; reference player (the host, or for a minute the partner whose cutscene just
; played) with a set that lacks streams of his activates his set here; and a
; local activation that would drop one of his streams while standing next to
; him is refused. This is what a cutscene teleport needs: pulled into a room
; you never walked into, the door shutting behind you, your game would keep
; (or reload) the room you came from.
FollowPartners=1
FollowReach=15
; A shut door loads the room of one side and drops the other. The game picks
; the side its user stood on, which is wrong after a cutscene pulled a player
; through the door. With DoorLeaveFix=1 the side follows where the players
; are, and the room your own body stands in is never dropped. During a
; partner's cutscene a door between you drops nothing (both rooms stay
; loaded) until the cutscene has pulled you to his side, at most
; DoorLeaveHoldMs, then your own side.
DoorLeaveFix=1
DoorLeaveHoldMs=15000
; A door's stream set asked for while our Isaac is more than FarDoorM metres from that door
; (a partner's door, or one held open for him that shut later) never replaces our rooms:
; its open set loads beside them, its leave set is skipped.
FarDoorGuard=1
FarDoorM=30
; Walking up to a door a partner opened (within DoorApproachM metres) loads its open set
; for our side, our current rooms kept.
DoorApproachLoads=1
DoorApproachM=6

[Loading]
; The level starts for everybody together: a machine that finished loading keeps its
; loading screen up (the engine's own LevelManager::OkToStart) until every partner has
; loaded the same map too, after a level change and after a checkpoint restart, in the
; campaign and on the survival maps alike. A machine is ready once it has loaded and
; the partners' Isaacs are there; nobody starts before every machine is ready.
SyncWithPartners=1
; The host numbers every load (its restart, a level change, a load from the menu) and
; releases it once every member is ready or left out; everybody leaves the loading
; screen at once. Ready means: loaded, the rooms of the checkpoint set in, a joiner's
; suit on. 0 = the older rule where each machine decided from what it heard.
HostBarrier=1
; A member still loading after this long is left out and comes in late (the level
; starts without him and he starts as soon as his own load is done).
SyncTimeoutMs=60000
; A joiner loading from the main menu (lobby join or join co-op) gets longer.
JoinTimeoutMs=120000
; A member that was ready and then went silent this long is left out (crashed, quit).
MemberSilenceMs=20000
; Ready waits for the rooms of the checkpoint's stream set, RoomsWaitMs at most.
WaitForRooms=1
RoomsWaitMs=8000
; Ready waits for a joiner's suit to be resident, SuitWaitMs at most.
SuitWaitMs=8000
; A reload of the same map: how long a partner still playing it gets to begin his own.
RestartGraceMs=15000
; The partners connect and appear while the loading screen is still up; the level starts
; once every partner's Isaac is there (GhostWaitMs at most, then he follows in the level).
PartnersDuringLoad=1
GhostWaitMs=10000
; The older stand-in for WaitForRooms: on a client the screen stays black ("LOADING")
; and Isaac held after a level start or restart until the rooms around him are loaded,
; CurtainHoldMs at most. Off with HostBarrier=1.
CurtainUntilRoomsLoaded=0
CurtainHoldMs=10000
; Rooms of the start set that it spawned hidden, or that a partner's game shows, are shown.
CurtainShowHiddenRooms=1

[Kinesis]
; A body a partner holds with kinesis cannot be grabbed here ("A PARTNER HOLDS THIS").
; Needs StreamHeld=1. Both machines need it.
PartnerHoldLock=1
; Stage one: every grab, drop and launch of the local Isaac is logged with the object's
; identity and sent to the partner, who logs whether he has that object at all.
Observe=1
; What the local Isaac holds, and then throws or drops until it lies still, is streamed
; 30x a second; the partner's copy is steered there by its own physics (Havok hard
; keyframe), so it flies, collides and lands with the original. Ghosts are left to TNL.
StreamHeld=1

[Drops]
; Stage one: every enemy loot drop on the host is logged with the pickup's identity.
Observe=1
[Necro]

; Playing a necromorph in Versus: the necro team picks a type and comes out of a vent.
; Off, the necro team spawns as Isaac. Its guards only act on necro bodies.
Enabled=1

; Sixth necro type. The spawn finds its template by index (attributes+0x78+type*0x10),
; so lending the neighbouring field the plugin's template for the call is enough.
; SixthTypeGuid points at the Lurker template first, as proof, later at the Leaper.
SixthType=1
; The plugin's number for it: 4 or 6 and up. 0-3 are the real types and 5 means
; "nothing picked", so those fall back to 6.
SixthTypeSlot=6
SixthTypeGuid=83957340-733ED679-5041454C-5243454E
; The Leaper: the borrowed template gets its model and animations at run time.
; LeaperModel=0 keeps the Lurker model and swaps only the movement, useful for
; telling the two apart when something does not fit.
Leaper=0
LeaperModel=1
; A/B test: name a loose stream here that is known to load, for example
; randomizer\ds2_randomizer_pool. If that one does not arrive either, the
; problem is loose streams in this process, not the plugin's file.
LeaperRecordStream=randomizer\ds2_leaper
; LoadPool: 0 never, 1 at every level start, 2 on demand (F11 loads it on
; every machine first; checkpoint loads without it stay retail-clean).
LoadPool=2
; 1: entities still on global_assets when a world closes are destroyed while its
; managers exist. 0 left them to the engine, which crashed later (0x00DB43FA).
DestroyGlobalLeftovers=1
; Story co-op with necro players ("invasion"): a living necro goes back into the
; vents while a human plays a scene, and no ghost comes out until 4 s after it; the
; ghost camera takes a vent near the humans (within GhostFollowRadius metres) and
; moves on when a human goes into another room (at most every 2 s); the ghost's
; machine streams the humans' rooms and its free camera fires no trigger; a living
; necro opens and holds the door it stands at. The story screen's join row offers
; joining as a necromorph (left/right). The necro key (or a necro join) during a
; human's scene waits for its end; a ghost's machine shows the humans' rooms, and
; a vent in a room it does not show cannot be picked. A necro death drops no MP
; ammo in the story.
Invasion=1
GhostFollowRadius=25
; A vent is picked only within this many metres of a human and with its room's collision
; around it (every campaign vent exists even when its room is not loaded).
VentHumanRange=45
; When the vent selection starts and the followed human's room has no vent, or no vent is
; within this many metres of him, the ghost camera goes to him (the vent stays selected).
; A vent in his room is preferred over a nearer one behind a wall. 0 = off.
GhostHumanViewRange=50
; The dead necro's ghost outside the MP maps: GhostSpeed multiplies its walk and run speed
; (the game's 4 and 7 m/s; 1 = as shipped, at most 10), GhostNoclip=1 lets it fly through walls.
GhostSpeed=6
GhostNoclip=1
; Direct spawn (like L4D2 versus): as the ghost, fly to a spot and press DirectSpawnKey (a
; virtual key code, 81 = Q). The floor below the ghost is used when no human sees it, none is
; nearer than DirectSpawnMinDistance metres and one is within DirectSpawnMaxDistance.
; WatchSuit=1 changes the watching Isaac into its author's suit after he stands; it held every
; scene's start about 3 s (the respawned body never counted as whole). BirthSuits replaces it.
WatchSuit=0
; BirthSuits=1: a body we spawn is born in the right suit (Player::Init): the watching Isaac in
; the scene author's suit, Isaac back from the necro in his own, a bot in its own.
BirthSuits=1
DirectSpawn=1
DirectSpawnKey=81
DirectSpawnMinDistance=7
DirectSpawnMaxDistance=60
; A loud roar on the other machines when a partner's necro comes out (vent or direct spawn).
; SpawnSound picks one .emx for every type; empty = each type's own (pack, lurker, spitter, puker).
SpawnCue=1
SpawnSound=
; 1 = a necro player watches the humans' scenes as Isaac: a partner's scene cue turns
; him back into Isaac where the scene's author stood a second ago, he follows the scene
; (the leader's input decides), and at its real end he goes back into the vents. The
; humans never see him meanwhile. 0 = the old way: back into the vents for the scene.
WatchScenes=1
; After a death the next vent opens RespawnBaseSeconds x necros / humans later, at most
; RespawnMaxSeconds (one necro against three humans: 8 / 3 s, two against one: 16 s).
; The countdown shows on the necro's own screen. 0 = no wait.
RespawnBaseSeconds=8
RespawnMaxSeconds=30
; 0 = a necro player opens no door; an open door stays open while he stands in the room
; next to it with a player on the other side, as for every player. 1 = a living necro also
; opens the closed, unlocked door he stands at.
OpensDoors=0
; A necro player (alive or at the vents) sees a beating heart over every human within
; RadarRange metres, through walls; it beats faster the closer he is.
Radar=1
RadarRange=40

[Spectate]
; Story co-op, experimental: a player who dies while another human lives restarts nobody.
; He watches a living partner through the multiplayer's spectator camera (mouse buttons
; switch between partners) and comes back as a new Isaac when a living partner reaches the
; next checkpoint, on that checkpoint, with what he carried. A partner's scene
; (SceneRespawn) or a level change he is waited for (LevelChangeRespawn) brings him back
; early at the partner's side. When nobody lives any more, the checkpoint restarts as before.
; Deaths during a scene stay the normal restart unless InScenes=1. Every machine needs it.
Enabled=0
; 0 = the multiplayer's spectator camera, 1 = the death camera stays.
CameraMode=0
Distance=2.5
Height=1.6
Fov=60
Orbit=0
BlendSeconds=0.75
InScenes=0
SceneRespawn=1
LevelChangeRespawn=1
; The dead body is put back where it fell when it drops through the floor.
CorpseHold=1
; Virtual key codes: 1 left mouse button, 2 right mouse button.
NextKey=1
PrevKey=2
; How long a checkpoint the partner reached may be missing here before he comes back beside
; the partner instead; the same when the partner is farther than FarFromCheckpointM from it.
FindWaitMs=8000
FarFromCheckpointM=40

[Cutscene]
; While your Isaac plays a scripted sequence, every partner body (and the gun
; in its hands) is hidden: one Isaac per screen, the one the cutscene moves.
HidePartners=1
; In the finale (from the first message named by [Mirror] LocalNameScope) every player
; plays his own scenes: nobody follows, yields, hides partners or streams his controller.
FinaleOwnScenes=1
; A scripted death (a boss grab, a failed prompt) never starts on your Isaac while you follow
; a partner's scene or just after it: his world decides, and his own death restarts both.
LeaderDecidesDeaths=1
; The player who triggered the cutscene decides it. Everybody else follows:
; their own sequence cues are not sent, their controller input is blocked and
; their Isaac takes no damage, so the outcome comes from the leader's cues.
; FollowerValveMs gives input and damage back if a sequence never ends.
LeaderDecides=1
FollowerInputBlocked=1
FollowerInvincible=1
FollowerValveMs=90000
; The leader's controller drives every follower's Isaac during his scene, so
; all machines pass or fail the same prompts together.
LeaderInputForAll=1
; Free aim in a scene (the ch11 Tiedemann javelin shots): the follower's
; stationary shooting takes the leader's pitch and yaw instead of adding
; the streamed mouse deltas at its own frame rate.
LeaderAimForAll=1
; Diagnostics: every message around a scene (local, direct, partner replay)
; with its tick, so both machines' timelines can be laid side by side.
SceneTrace=1


[ScenePartner]
; Experimental. In a cinematic whose mode is "puppet" your partners are not hidden: each
; stands next to your Isaac and plays an Isaac clip, on your screen only (every machine
; does this for the partners it sees; nothing is sent). Their guns stay hidden.
Enabled=0
; Modes per scene, by the name stem of its sequences (igc_03_03 for igc_03_03_player_010;
; analysis/COOP_SCENE_LIST.md has every scene with its cast). A scene in neither list
; takes DefaultMode (hidden or puppet). PuppetScenes=* makes every scene a puppet scene.
; The list below is the scenes without a confrontation (no grab, no death, no Nicole);
; igc_03_03 (Daina's betrayal) needs a scene of its own and stays hidden.
DefaultMode=hidden
PuppetScenes=igc_01_03,se_01_03,se_01_04,igc_01_06,igc_03_04,se_04_02,igc_06_02,se_06_06,se_06_11,se_06_12,igc_08_02,se_09_06,se_09_11,se_09_14,igc_10_01,se_11_03,igc_11_04,igc_11_10
HiddenScenes=
; The clip the partners play (a state of the player's always loaded banks; the log says
; when it is not valid). Each further partner stands on the other side, then further out.
Clip=unarmed_s_baseidle
SideOffset=1.0
BackOffset=0.3
; Follow=1 keeps them beside your Isaac the whole scene; 0 parks them where he stood
; when the scene began (re-placed for its first 2 seconds, after the scene's teleport).
Follow=0
; 0: a parked partner has no collision, so it cannot block your Isaac's scripted path.
PuppetCollision=0
; A scene part with a partner clip of its own (variants/anims/partner, see docs/CUTSCENE_EDITING.md)
; is a puppet scene by itself and plays that clip in sync with Isaac's. Where it stands:
; path = moved along the clip's own root path every frame (randomizer\ds2coop_partner_paths.bin),
; origin = at the level origin (if the partner walks twice as far, or stands far off, try this),
; isaac = on your Isaac as the part begins.
SyncedPlacement=path


[Physics]
; Loose objects and corpses: where they come to rest after being kicked, thrown, shot or
; killed is sent once a second (RestSyncMs) for everything within RestRadius metres of a
; player, at most RestMaxPackets packets (240 bytes, about 10 bodies each) a second.
RestSync=1
RestSyncCorpses=1
RestSyncMs=1000
RestRadius=25
RestMaxPackets=8
RestClasses=ScriptableProp,DamageableProp,DismemberableProp,BreakableContainer

[Bot]
; A companion bot: a second Isaac the game itself runs, on a virtual controller. It joins
; by itself a few seconds after the level stands (solo or as the host), stays near the
; player, runs to doors and lifts, fights (aims at limbs, plasma cutter, keeps its distance,
; melee when close), picks up items, heals, uses stasis on big enemies and reloads.
; It walks the NavPower mesh, the player's own trail where there is none, and catches up
; when it is left behind. It cannot die (a death would restart the level).
Enabled=1
; How many bots at once, 1 to 3 (the camera manager has room for three next to Isaac).
; They share out the enemies, fight the big ones together, help whoever is attacked,
; keep to their own side of the player and never shoot through a player.
; Online, every human partner takes one bot's seat (four bodies at most).
Count=3
; Online: the host's bots are sent to the partners, so everybody sees them fight.
GhostToClients=1
; Partner pose: with no enemies and nothing to pick up, and the player standing, the first
; two bots each keep one place by the player and watch him, like Sheva in Resident Evil 5.
; The places are in metres of the player's own frame: forward (minus is behind him) and
; right (minus is to his left). Measured where they looked good: the first in front of him
; a little to his right, the second behind him to his right.
PartnerPose=1
PartnerForward=0.97
PartnerRight=0.85
Partner2Forward=-0.65
Partner2Right=0.98
; Bench: power nodes a bot picks up are its own. When the player leaves an upgrade bench,
; each bot spends them on the guns it carries (damage first, then capacity, reload, speed).
; The upgrade trees are shared by every Isaac, so the player's guns of that kind gain too.
Bench=1
; Store: credits a bot picks up are its own. When the player leaves a store, each bot buys
; med packs (up to two, the kind the player or a bot carries) and ammo for the guns it
; carries (up to about three clips in reserve), paying with its own credits.
Store=1
; Kiosks: after the player leaves a bench or a store, the bots walk up to it one at a time,
; use it the way he does (docking and the real animation), make their purchases while they
; are in the menu and back out. The player's own controls are not touched. 0 = the bots buy
; straight away without going there (Bench and Store above still apply).
UseKiosks=1
; Suit: 1 = each bot wears a suit the player owns (worn or in his safe), its FavoriteSuits
; from DS2BotProfiles.ini first and none the player or another bot wears if it can be
; helped. Picked when its body stands, again at each store visit, kept across new bodies.
; 0 = the bots wear the player's suit.
Suit=1
; Infinite ammo: every gun a bot carries keeps three clips in reserve (it still reloads).
InfiniteAmmo=1
; Stasis on the player or a bot (a teammate's shot or a stray one) lasts at most this many
; seconds. Enemies keep the full length. 0 = off.
PlayerStasisSeconds=2
; In a fight a bot now and then grabs a loose prop with kinesis and throws it at its
; target (experimental). 0 = off.
Kinesis=1
; Enemies may attack the bots: each bot gets the attack-slot phase the game gives a
; Player it registers itself (id % 15). Without it an enemy that picked a bot only
; stood next to it. 0 = the old way.
AttackSlots=1
; Bots are hidden while the leader runs a scripted sequence (cutscenes, scripted
; kills) and shown again after it. 0 = off.
HideInScenes=1
; Which of the leader's sequences hide them (1 = hide): in-game cinematics (igc_),
; scripted events (se_), short player actions (pc_: helmet, fear, boss grabs),
; visions and horror moments (vt_/seh_), and sequences not in the table.
HideInCinematics=1
HideInScriptedEvents=0
HideInPlayerActions=0
HideInVisions=0
HideInUnknownScenes=0
; Bots far from the leader (20 m, 30 m in a fight, or another floor) for a few
; seconds, left outside the lift he rides or far off after a scene are put by him.
; 0 = off.
AutoTeleport=1
; On the MP maps and in the campaign arenas a bot is only put by the leader when it
; is stuck, never for being far off. 1 = the campaign's rules there too.
SurvivalDistanceTeleport=0
; Versus: the bots can die (everywhere else they never do) and a new one comes this
; long after the death, at an MP spawn point near the team as a player respawns.
; 0 = they never die there either.
VersusDeaths=1
VersusRespawnMs=5000
; A partner's ghost that sits in a bot's Player slot (1..3) is registered again in
; a free slot from 4 up, so the bot can come back. 0 = the bot waits.
MoveGhostsOut=1
; While the leader is dead the bots stay around his last spot and go on fighting.
; 0 = they stand still until he is back.
Leaderless=1
; A bot put down in a lift cabin (by any teleport or the call key) stands still
; this long (ms), so it rides along instead of walking off the platform. 0 = off.
LiftHoldMs=6000
; 0 = the human and the bots walk through one another (no collision between
; Isaacs). 1 = they collide as usual.
PlayerCollision=0
; In the straitjacket run at the start (the psych hall) the bots run right behind
; the leader in a line and ignore the enemies; one that falls behind is put by him.
ChaseFollow=1
; A bot at rest that stares into a wall (or where the walkable floor ends) turns once
; toward the most open way, takes a short step and stands facing the room. Not with
; the leader right there that way; on a hold spot it only turns. 0 = off.
FaceOpenSpace=1
; Nicole never takes a bot as her target. Her only attack is a grab, which the bots
; refuse: with a bot as her target she never grabbed the player.
NicoleIgnoresBots=1
; A bot's shot into a corpse does not pop its loot; the player's stomp does (a
; corpse drops once, on the first hit after death). A bot's stomp on purpose
; (StompCorpses) still drops it.
KeepCorpseLoot=1
; After a fight, once no enemy has been about for a moment, the bots stomp fresh
; corpses near them and the player (their own kills first) until the loot drops, and
; pick it up. A corpse the player stands at is his. 0 = off.
StompCorpses=1
; Stomps one corpse or crate gets from the squad at most (its loot drops on the
; first one that lands). 1 to 6.
CorpseStomps=3
; Calm, the bots also stomp supply crates and open lockers within 14 m of the player,
; then pick up what drops. Locked ones and those the level's logic uses stay shut.
; 0 = off.
LootContainers=1
; Percent of the supply crates the bots shoot open from up to 9 m instead of stomping
; them, with a plasma cutter, pulse rifle, line gun or seeker rifle in hand and a clear
; line; the same crates for every bot. Never under hold fire. 0 = always stomp.
CrateShootPercent=50
; An enemy grabs the player: every bot in reach makes the grabber its target at
; once, past hold fire, the attack order and the focus limits, until he is free.
; 0 = off.
RescueLeader=1
; Zero-G: bots take off after the leader, fly behind him and land by him when he
; stands (needs OwnLookInput=1). 0 = they only float where the game lifts them.
ZeroGFlight=1
; Vacuum: a bot with less air than the leader (he found a canister) is refilled.
ShareAir=1
; Bots have kinesis and stasis exactly when the leader has them (chapter 1 grants),
; with his stasis energy when stasis arrives. 0 = whatever their restored record says.
MirrorModules=1
; With UseKiosks=1: a store or bench near the leader makes a store room. The bots
; take their turns there on their own; whoever has not had one when he leaves the
; room buys, upgrades and changes its suit at once. 0 = only after he used a kiosk.
StoreRooms=1
; With UseKiosks=1: 1 = the bot really opens the bench or store menu (experimental;
; a stuck bot store took over the player controls twice). 0 = it walks up, browses a
; moment and buys without a menu.
KioskEnter=0
; Power node doors: a bot with a power node of its own opens a locked room (the panel
; that costs a node) once the player has stood near the panel a moment without using
; it and no enemy is about. It walks up, uses the panel the game's way and pays with
; its own node; one bot per panel, never while the player is at it. 0 = off.
UseNodeDoors=1
; How near the player must be to the panel (metres), and how long (ms).
NodeDoorLeaderMeters=6.0
NodeDoorWaitMs=1500
; Stasis stations: a bot whose stasis energy is below StasisStationBelow percent uses
; a ready station within StasisStationMeters of it and of the player, when calm, one
; bot at a time and after the player if he is charging there. 0 = off.
UseStasisStations=1
StasisStationBelow=50
StasisStationMeters=12
; A bot's own camera (pushed against a wall) no longer fades the bot, the player or
