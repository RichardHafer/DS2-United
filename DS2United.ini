; hacking stations, placed enemies) does not spawn while it runs.
Arenas=1
; Arenas in the other modes: an arena plays Mercenaries or Hold the Zone when picked
; (its capsule and zone points are built in; Objective and Versus play survival
; there), a death respawns at the arena spot nearest to the team (only with [Respawn]
; Enabled=1, off by default; else the arena checkpoint reloads) and co-op joiners are
; launched into the arena with the host. 0: survival only and a death reloads the
; arena checkpoint.
Modes=1
; An arena starts as a new game: patient suit, no gun. Kit=1 dresses Isaac in
; Suit (Engineering Suit by default; the bots follow) and gives the plasma
; cutter, ammo, stasis and kinesis.
Kit=1
; Black ("LOADING") from the arena's first frame until Isaac stands on his start spot in the kit's suit.
StartCurtain=1
; 1 = the campaign's Nicole and dementia scripts stay off during an arena match (a crypt
; set piece locks a door while she shows)
BlockHallucinations=1
; 1 = invisible collision that blocks only live necros (a scripted prop in the security
; checkpoint door of arena_ch10) is opened when it stands within 2.5 m of a door the arena
; keeps usable; Isaac, bots and corpses were never blocked by it
OpenNpcClips=1
; 1 = a held door that stands open but still blocks the AI's pathing (its NavPower
; obstacle live or its links cut for two passes) is unblocked with the door's own
; functions; the door's open animation normally does this itself. 0 = only logged.
UnblockHeldDoors=1
Suit=30C9B946-E243D95F-54544950-32303153

[SurvivalMusic]
; Music while a wave is on (Survival; a Mercenaries, Objective or Zone run; a
; Versus round): a combat track when it starts, then action and combat in turn,
; as in an MP round; StopDelaySeconds after the wave is cleared the calm music
; takes over. In co-op every machine plays it for itself, following the host.
Enabled=1
StopDelaySeconds=2
; auto: the original MP tracks when the map has them (needs [MpMap] AllowMpMusic=1),
; else the campaign's action sections, whose layers grow with the danger, and
; a tension section between the waves. mp or campaign forces one of them.
Source=auto

[Respawn]
; Experimental: on a multiplayer map Isaac respawns at a spawn point instead of
; the level restarting, as in an MP round (no killer card, no spawn point menu).
; Survival rules:
;  - Solo: Lives respawns per wave, DelayMs after the death; every cleared wave
;    fills them up again.
;  - With another human player still up: back once the wave is cleared (no life
;    used). Bots do not count.
;  - Everybody down: game over, the run starts over from wave 1 on the same map
;    (DS2Survival.ini GameOverSeconds). The level is never restarted.
;  - Outside a wave: back after DelayMs, no life used.
Enabled=0
Lives=1
DelayMs=4000
; How long after the wave end a waiting player comes back.
WaveClearedDelayMs=1000
; A player who is down and hears no game over from the host this long comes back anyway.
DownTimeoutMs=45000
; 1: the game's own MP death path schedules the respawn (in co-op it first waits
; for the partners to drop the old body); 0: the respawn is scheduled directly.
UseMpBranch=1
; Give the map loadout again after the respawn.
RestoreLoadout=1
; 1 = with a life left there is no red death screen and nothing is dropped on death (the
; countdown shows in the middle of the screen instead).
HideDeathScreen=1

[Lifecycle]
; How players arrive, die, come back and restart in survival, Mercenaries, Objective, Hold the
; Zone and Versus (MP maps and campaign arenas). 0 = everything as before 02.11.
Enabled=1
; The game's own spawn code puts a new or respawned Isaac on his spawn point, facing the point's
; way (an arena spot: the arena's middle), and dresses him by the suit rule: the Engineering Suit in
; survival, Objective and Hold the Zone (a respawn too, whatever was bought), the character setup's
; suit in Mercenaries and Versus. The old curtain, spawn guard and fall rescue stay as a fallback and
; say so in the log when they fire.
NativePlacement=1
; After a fallback move by hand (not by the spawn code) the camera is turned the way the body faces,
; with the same two calls the spawn code makes. 0 = the camera keeps the checkpoint's direction.
AimFromBody=1
; On an MP map the arrival's Isaac is made under the game's own loading screen (while the level
; waits to start), so the first frame shows him on his point; the arrival curtain only when that
; did not take. Campaign arenas arm the start spot and suit before their level request.
EarlySpawn=1
; Game over and mode results: the host first tells everybody, downed players wait for the reload
; instead of coming back into the old map, then the map restarts for all.
SyncedRestart=1
; How long the host waits for the partners' answer before it restarts anyway, and how long a
; machine waits for an announced restart before it gives up.
RestartAckMs=2500
RestartTimeoutMs=30000
; Log the first sync after every arrival (links, ghosts in and out, enemies, wave state, suits).
JoinTimeline=1
; A joiner that sees no ghosts 6 s after arriving asks the host to send them again (at most 3 times).
JoinResync=1
; The host's enemy check per partner keeps its answer while the partner's level stands, so a
; respawn or a short stall no longer makes every enemy vanish and come back on the clients.
StickyTemplates=1
; Timeouts that log what is missing: spawn, first sync after an arrival, respawn.
SpawnTimeoutMs=8000
JoinSyncTimeoutMs=15000
RespawnTimeoutMs=15000

[Debug]
; Our own debug menu on the supply terminal's panel. Key opens and closes it
; (45 = Insert; the game never sees it); A/D change the tab, W/S the row, Q/E
; jump a chapter in LEVELS, Space or a click on the selected row uses it (a
; checkpoint needs it twice). The game sees no input while it is open.
; LEVELS: every campaign checkpoint of the game's map.txt, loaded in a level the
; way the level script changes chapters, from the main menu as a new game (then
; with the chapter's start suit and the plasma cutter).
; WEAPONS, SUPPLIES, SUITS: the supply terminal's deliveries for free (needs
; [Shop] Enabled=1). CHEATS: god mode, infinite stasis, full health, stasis,
; credits and power nodes.
Enabled=1
Key=45
; 1 = after a checkpoint jump saves and restart points are held until the main
; menu, so a jump never writes over your campaign save.
HoldSaves=1
; What "Add credits" and "Add power nodes" give.
Credits=10000
PowerNodes=5

[Survival]
; Experimental. The code default is 0; this template turns it on for the
; first playtest. The director does nothing on any map but Map; "any" runs it on
; every MP map, the Outbreak maps included (the best wave is kept per map).
Enabled=1
; Where the waves run: any for every multiplayer map, the Outbreak maps and the campaign arenas, or one of mp...
Map=any
; Virtual key that starts the first wave at once or skips a pause (0: none).
; 107 is Numpad +.
StartKey=107

