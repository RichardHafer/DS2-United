[MpMap]
; Experimental: a multiplayer map in single player. In the campaign press Key twice
; within 3 s (the first press shows a notice) to load Map; on the MP map the same
; double press goes back to the campaign checkpoint you came from. Nothing is hooked
; and nothing changes until the first double press. Back up your save first.
Enabled=1
; 110 = Numpad decimal point (NumLock on). 0 = off.
Key=110
; Every room of the map stays visible. The map shows one stream set at the arrival and the
; next ones come with the objectives, so outside Objective the rooms behind open doors
; stayed black (Fuel Core).
ShowAllRooms=1
; mp_bombRun, mp_detonate, mp_escape, mp_gov or mp_solar.
Map=mp_bombRun
; The map's stream list; empty = <Map>.str.
Stream=
; After placing the player on a spawn point (arrival, respawn) send the spawn
; point's own usage message as the game does: it shows the zones of that area.
; With 0 a respawn in another area can stay dark until a doorway is crossed.
SpawnZoneMessage=1
; The Outbreak maps' sounds are 16 bit big endian PCM, a decoder the PC build
; carries but never registers. 1 registers it when a sound bank asks for it;
; with 0 loading an Outbreak map crashes.
RegisterPcmCodec=1
; Those sounds are also uncompressed and overflow the game's 96 MB sound bank
; memory. 1 puts what no longer fits into extra memory instead of crashing.
SoundBankOverflow=1
; Their meshes still use the Xbox strip format; 1 converts them for the PC
; renderer (Mark de Rune's approach) and ignores the Xbox material values the
; PC tables cannot hold. With 0 the Outbreak maps draw torn.
OutbreakRender=1
; No save of any kind while you are away from the campaign (slot saves, autosaves
; and the checkpoint restart points), so the campaign slot can never boot into an MP map.
HoldSaves=1
; Off MP maps (campaign, campaign arenas, story joins): when Isaac falls freely (faster
; than 12 m/s down, 8 m below the last spot where he stood still), put him back there.
; Floors that never loaded on a client let players fall forever (24.10.). 0 = off.
CampaignFallGuard=1
; A story join starts a new game in the patient suit: 5 s after Isaac appears he changes
; into the joined chapter's start suit when he still wears the patient suit. 0 = off.
JoinSuit=1
; The map's start checkpoint asks for five character streams that only exist in
; global_mp_assets. 1 = drop them from the request (logged), 0 = let them through
; to compare (the engine skips unknown streams on its own).
DropForeignStreams=1
; Loading screen watchdog: after this long without any loading progress the log
; gets the stuck state and streams, and the key offers the way back.
LoadWatchdogMs=45000
; Keep the online-only MP logic from spawning (end of round, end-game camera,
; round timers, objective markers, team relays, the map's own slashers).
BlockMpLogic=1
BlockEndRound=1
; The round clock with its in-world time displays and the scoreboard hub; the
; survival and mercenaries time shows on the overlay instead.
BlockRoundTimers=1
BlockObjectiveMarkers=1
BlockTeamLogic=1
; The objectives you shoot (mp_bombRun, mp_detonate, mp_gov) are tuned for a
; team of four: in an MP round each hit counts 4 / humans times. 1 = the same
; here, with the real team (you and your co-op partners; with
; ObjectiveTeamCountsBots=1 your bots too; at most four). Bots do not make an
; objective tougher by default.
ObjectiveDamage=1
ObjectiveTeamCountsBots=0
; The blue icon on your back next to the stasis bar while you carry an
; objective item, as in an MP round.
CarryIcon=1
BlockMpSlashers=1
; Lets the slashers' spawn records register while the spawn filter still refuses
; the slashers themselves. Survival vent spawns need these records to come out of
; the map's vents. Needs BlockScriptSpawns=1.
KeepSlasherRecords=1
; Lets the eight MP round music streams (global_mp_assets) spawn for
; [SurvivalMusic]; the rest of global_mp_assets stays blocked.
AllowMpMusic=1
; The MP map's own checkpoint pulls in global_mp_assets (the multiplayer player
; setup). Its entities (UI popups, player templates, MPLevelSettings, cameras) are
; kept from spawning; the second test crashed on such a UI popup.
BlockMpGlobals=1
; Also block them when a script spawns them (FuncSpawn), not only when the map's streams do.
BlockScriptSpawns=1
; No MP map carries a player: Isaac is spawned from this global_assets template
; at a multiplayer spawn point (-1 = the first usable one) once the map runs for PlayerWaitMs.
SpawnPlayer=1
; Start the visit at the MP map's own checkpoint: the campaign checkpoint GUID is
; cleared for the visit and written back on the way home. 0 = keep it (the first
; test then put the player back into the campaign rooms).
UseMapCheckpoint=1
; A player who arrives farther than PutOnMapMeters from every MP spawn point is
; moved to one.
PutOnMap=1
PutOnMapMeters=60
PlayerTemplate=4BC78C36-9D70FEE7-544E4543-53574F4B
SpawnPoint=-1
PlayerWaitMs=500
; How long the local body must stand on an MP map before the co-op session ticks
; (players see each other, the host builds the necro respawn manager): the
; campaign keeps 4000; an MP map is fully loaded once it runs. 250..4000.
SettleMs=1500
; The loading screen ends before the player stands, and the camera looked into the
; void for about a second. 1 = the screen stays black (drawn by the overlay) until
; the body or the necro ghost stands and ArrivalCurtainMs more, 6 s at most.
ArrivalCurtain=1
ArrivalCurtainMs=600
; A plasma cutter and this many ammo packs for him.
GiveLoadout=1
AmmoPacks=3
; Stasis and kinesis on, stasis energy full.
EnableStasisKinesis=1
; If his body comes up without a model, he is dressed in this suit (the default one).
DressIfBare=1
DressSuit=30C9B946-E243D95F-54544950-32303153

