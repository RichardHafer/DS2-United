;======================================================================
; Schematics and workbench
;======================================================================

[SchematicRandomizer]
; Schematics you find unlock a different item in the store.
Enabled=1
; A missed item reaches the store at the chapter of the place its schematic now lies at.
StoreFollowsSchematics=1

[BenchRandomizer]
; Bench upgrade nodes trade stats. A weapon keeps the same stats
; and the same number of each, only where they sit on the grid moves.
StatShuffle=1

; Stats may also sit on cells that used to be plain connectors.
NodeShuffle=1

; A tree always opens on a real upgrade.
ProtectStartPoints=1

; Bench seed. Commented out, the seed above is used. Never change it
; mid-playthrough: nodes you already bought would give something else.
; Seed=50