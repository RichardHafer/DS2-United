[VentFamilies]

; 1 allows this family to arrive through a vent as a replacement. 0 keeps
; it to ordinary walk-in spawns only.
;
; This is the blunt version of DS2VentDonorBlocklist.tsv. That file learns one
; record at a time, and every lesson costs a playthrough: a donor that never
; becomes an NPC holds its spawn point, and a room counting deaths then waits
; for one that can never come. Lurker is off because exactly that happened in
; the hospital lobby, and thirteen more vent-capable Lurker records sit behind
; the one that failed.
;
; A family switched off here loses nothing but vents.
Zombie=1
Exploder=1
Leaper=1
Lurker=0
PackEnemy=1
Pregnant=1
Puker=1
TubeBeetle=1
Brute=1
Infector=1
Stalker=1
Hunter=1
Guardian=1
GuardianPod=1
GuardianTentacle=1
Nest=1
NestProjectile=1
Landmine=1
DividerCore=1
DividerPart=1
SwarmEnemy=1
Tripod=1
WindowTripod=1
BossTripod=1
TripodProjectile=1
Kong=1
NicoleBoss=1
DragTentacle=1
LeviathanTentacle=1
Polyp=1
SlamDragTentacle=1
SlugTentacle=1
StabTentacle=1

[ExperimentalClasses]
; Kinds that only take part when you say so. Infector and Swarm work;
; Stalker, the Divider and the Hunter are experiments. A Divider or the
; Hunter never replaces an enemy whose death a door is waiting for.
Infector=1
Stalker=1
SwarmEnemy=1
DividerCore=1
DividerPart=0
Hunter=1


