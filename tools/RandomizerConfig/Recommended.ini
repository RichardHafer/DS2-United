;======================================================================
; Dead Space 2 Randomizer
;======================================================================

; Every switch is 0 = off, 1 = on. Restart the game after editing.
; Back up your saves. High frame rates are fine, FpsCap is optional.
; Keep your own settings between the two rulers below; leave the
; Advanced part alone unless you know what a line does.

[DS2Randomizer]

; --- Settings you may want to change ------------------------------

; Master switch. 0 turns the whole mod off without uninstalling it.
Enabled=1

; Which enemies replace which. Same seed = same game every time.
; Change it for a different run. Do not change it mid-playthrough.
Seed=69

; Percent of spawns that get replaced. 100 = all, 50 = half, 0 = none.
Chance=100

; 1: a slasher can become a puker, a leaper a pack, and so on.
; 0: enemies only swap with other looks of their own kind (much tamer).
CrossFamily=1

; 1: spawn more than one enemy per spawn point. How many is set
; per enemy type in [MoreEnemies] at the bottom.
MoreEnemies=0

; Frame rate limit, 30 to 240. 0 leaves the frame rate alone; the
; elevator hangs at high frame rates are fixed by ZoneUnloadHeal below.
FpsCap=0


; --- Advanced: leave as is ----------------------------------------

; Vent spawns may become other looks of the same kind.
VentVariants=1

; Vent spawns may become other kinds too (needs CrossFamily).
CrossFamilyVents=1

; Rebinds vent spawns to the new enemy's climb-out.
VentRebinding=1

; Looser vent matching (spawn-done messages may differ). Experimental.
VentMessageContract=0

; Replaced enemies belong to the level (fixes checkpoint restarts).
PoolActorsFollowLevel=1

; Frees the enemy pool when a level ends.
ReleasePoolAtLevelEnd=1

; Debug only. Leave 0.
PoolHoldForever=0

; Safety guard for level teardown.
GuardServiceRelease=1

; Scripted spawns (doors, ambushes) may be replaced too.
ScriptedArrivals=1

; Corpses raised by an infector may be replaced too.
InfectedArrivals=1

; How many candidates are tried per spawn.
MaxDonorLookups=8

; Enemies are built from the shared pool templates.
GlobalTemplates=1

; Debug only. Leave 0.
PinPoolPrerequisites=0

; Loads the enemy pool at the start of every level.
GlobalStreamProbe=1

; Takes the pool's pack boy template that never attacks out of play.
DirectDonors=1

; Stat variants (faster, tougher, recoloured). Not in this build.
Variants=0

; Speed and size of variants. Not in this build.
VariantRuntime=0

; Test aid. Leave empty.
VariantBias=

; Test aid. Leave empty.
PlanDump=

; The loading screen stays at least this long.
MinimumLoadingSeconds=0

; The loading screen waits for the enemy pool.
LoadingWaitsForPool=1

; Upper bound for that wait.
MaximumLoadingSeconds=30

; Lets a zone switch go on when only the enemy pool still holds a package (high FPS elevator hangs).
ZoneUnloadHeal=1

; MoreEnemies also for vent spawns.
MoreEnemiesVents=1

; Gap between extra vent spawns.
MoreEnemiesVentDelayMs=2000

; Hides the copies' spawn-completion messages, so level scripts count
; each spawn point once.
MoreEnemiesHideCompletion=1

; Cap on the total per spawn point, 1 to 8.
MoreEnemiesMaxPerTrigger=4

; Extra spawns allowed per 16 arrivals, all kinds together (0 to 112).
MoreEnemiesPerSecond=48

; Watches the replaced enemies: repairs their state tables and deals with
; ones that never come alive or stay stuck in a vent.
Watchdog=1

; Lets the watchdog repair state tables after the game rebuilds them.
WatchdogRepairTables=1

; When a replacement could not be given the original enemy's death message
; (death_message refused= in the log), the watchdog says that message the
; moment the replacement dies, so a room that counts deaths still completes.
WatchdogDeathProxy=1

; Lets the watchdog kill a stuck replacement when its timeout runs out,
; through the game's own death path.
WatchdogKill=1

; A scripted room counts death messages, not corpses, so a replacement that
; never came alive holds the door shut forever. With this on, the watchdog
; says that one message on the actor's behalf when it gives up on it. Only
; for an actor with no state machines after the full timeout, or one still
; stuck in its vent, never for an enemy you simply have not walked to yet.
WatchdogReleaseDeathMessage=1

; Seconds before an enemy counts as stuck.
WatchdogSeconds=90

; Timeout for enemies that came through a rebound vent (0 = the normal one).
WatchdogVentSeconds=0

; Seconds until the watchdog logs once what a replacement is doing, or
; the vent time below if that is later (0 = off).
WatchdogStateProbeSeconds=6

; Seconds in a vent climb-out before a replacement is logged as a suspect.
WatchdogVentStuckSeconds=60

; Writes every spawn to the log. Needed for bug reports.
ObserveSpawns=1

; Buffer for detailed spawn lines between two log writes.
DetailedSpawnLimit=2048

; More log lines for bug reports.
StreamRegistryDiagnostics=1

; More log lines for bug reports.
StreamWatchDiagnostics=1

; Very noisy log. Only when asked for.
MessageTrace=0

; Debug only. Leave 0.
TextureProbe=0

; Reads plugins\DS2SpawnerRules.tsv (per-spawner rules). Extra spawns
; bound to a spawner need it too.
SpawnerTools=1


[Loot]
; Ammo and credits in every pickup, in percent of the authored amount (100 = as authored).
AmmoPercent=134
CreditsPercent=100


